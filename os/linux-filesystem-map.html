     tip:'<code>grep "status=sent" /var/log/mail.log | tail -20</code> shows recently sent mail. <code>grep "rejected" /var/log/mail.log</code> shows rejected messages.'},

    {id:'log-cron-log',name:'cron.log',cat:'var',label:'cron.log',
     type:'cron scheduler log',
     role:'Cron daemon log: job executions, output, timing, and scheduling errors.',
     desc:'Records: cron daemon start/stop, every cron job execution (user, command, PID), job completion, and scheduling errors. On Debian/Ubuntu, cron output also goes to syslog unless /etc/cron.d/ jobs redirect to /dev/null. On RHEL, cron logs to /var/log/cron. Critical for: verifying scheduled jobs ran, diagnosing missed or failed jobs.',
     perms:'-rw-r--r--  root adm',
     files:['cron.log','cron.log.1'],
     tip:'<code>grep CRON /var/log/syslog | tail -20</code> on Ubuntu. <code>grep "CMD" /var/log/cron.log</code> shows executed commands.'},

    {id:'log-cloud-init',name:'cloud-init.log',cat:'var',label:'cloud-init.log',
     type:'cloud-init provisioning log',
     role:'Cloud-init execution log for cloud and VM instances (AWS EC2, Azure, GCP, OpenStack, etc.).',
     desc:'Records every stage of cloud-init: datasource detection (which cloud platform), network configuration, package installs, user creation, SSH key injection, user-data script execution. cloud-init-output.log contains raw stdout/stderr from user-data scripts. Essential for debugging failed instance provisioning.',
     perms:'-rw-r--r--  root root',
     files:['cloud-init.log','cloud-init-output.log'],
     tip:'<code>cloud-init status --long</code> shows current state. <code>cloud-init analyze</code> shows timing breakdown. <code>cloud-init clean --logs</code> resets for re-run.'},

    {id:'log-xorg',name:'Xorg.0.log',cat:'var',label:'Xorg.0.log',
     type:'X11 display server log',
     role:'Xorg/X11 display server log: driver loading, display configuration, input device detection, errors.',
     desc:'Contains: GPU driver loading (NVIDIA/AMD/Intel), screen resolution detection, monitor EDID data, input device enumeration (keyboard, mouse, touchpad), GPU memory info, GLX/OpenGL initialization, error messages for driver failures. (:0) = first display. ~/.local/share/xorg/Xorg.0.log also written for rootless Xorg.',
     perms:'-rw-r--r--  root root',
     files:['Xorg.0.log','Xorg.0.log.old','Xorg.1.log'],
     tip:'<code>grep "(EE)" /var/log/Xorg.0.log</code> shows errors. <code>grep "(WW)" /var/log/Xorg.0.log</code> shows warnings.'},

    {id:'log-cups-dir',name:'cups/',cat:'var',label:'cups/',
     type:'CUPS print service logs',
     role:'CUPS printer subsystem logs: print jobs, printer errors, and web interface access.',
     desc:'error_log: CUPS daemon errors and system-level events, printer driver issues, IPP protocol errors, authentication failures for the CUPS web interface. access_log: All HTTP requests to the CUPS web interface (http://localhost:631). page_log: Every printed page with job ID, printer name, user, document, page count, billing info. Log level controlled by LogLevel in /etc/cups/cupsd.conf.',
     perms:'drwxr-xr-x  root root',
     files:['access_log','error_log','page_log'],
     tip:'<code>lpstat -W completed -l</code> shows completed print jobs. <code>grep " 5[0-9][0-9] " /var/log/cups/access_log</code> shows CUPS errors.'},

    {id:'log-samba-dir',name:'samba/',cat:'var',label:'samba/',
     type:'Samba Windows file sharing logs',
     role:'Samba (SMB/CIFS) server logs: authentication events, file access, share connections.',
     desc:'log.smbd: SMB daemon events — client connections, authentication (including Kerberos and NTLM), file access errors, share enumeration. log.nmbd: NetBIOS name service events — name registration, browse list. log.<ip>: Per-client log files. log.winbindd: Domain authentication via winbind. Verbosity controlled by log level in smb.conf.',
     perms:'drwxr-xr-x  root root',
     files:['log.smbd','log.nmbd','log.winbindd','log.<client-ip>'],
     tip:'<code>grep "authentication for" /var/log/samba/log.smbd</code> shows authentication attempts. Increase log level in smb.conf for more detail.'},

    {id:'log-openvpn',name:'openvpn/',cat:'var',label:'openvpn/',
     type:'OpenVPN logs',
     role:'OpenVPN VPN server/client logs: tunnel establishment, authentication, routing, errors.',
     desc:'Records: TLS handshake with client certificates, successful/failed authentication (using tls-auth or certificates), IP address assigned from VPN pool, routes pushed to clients, reconnection events, channel errors. Log verbosity controlled by verb directive in openvpn.conf (0=silent, 3=medium, 9=debug).',
     perms:'drwxr-xr-x  root root',
     files:['openvpn.log','openvpn-status.log','server.log'],
     tip:'<code>tail -f /var/log/openvpn/openvpn.log</code> monitors connections. <code>cat /var/log/openvpn/openvpn-status.log</code> shows currently connected clients.'},

    {id:'log-unattended',name:'unattended-upgrades/',cat:'var',label:'unattended-upgrades/',
     type:'automatic security updates log',
     role:'Log of automatic security package updates performed by unattended-upgrades.',
     desc:'unattended-upgrades.log: which packages were automatically upgraded, any packages that were held back, dpkg errors during upgrade, timestamps. upgrade-output.log: full apt-get output from each unattended upgrade run. Important for: knowing when security patches were applied, debugging auto-upgrade failures.',
     perms:'drwxr-xr-x  root root',
     files:['unattended-upgrades.log','unattended-upgrades-dpkg.log','upgrade-output.log'],
     tip:'<code>cat /var/log/unattended-upgrades/unattended-upgrades.log | grep "Packages that will be upgraded"</code> shows auto-upgraded packages.'},

    ]},// end var-log children

   // ── /var/spool ──
   {id:'var-spool',name:'/var/spool',cat:'var',label:'spool/',
    type:'application queue directories',
    role:'Queued data awaiting processing: print jobs, outgoing mail, cron tasks.',
    desc:'SPOOL = Simultaneous Peripheral Operation OnLine. Data persists until a daemon consumes it. Queues survive daemon restarts ensuring jobs are not lost.',
    perms:'drwxr-xr-x  root root',
    files:['cron/','mail/','cups/','mqueue/','lpd/','at/','anacron/','rsyslog/'],
    tip:'<code>lpq</code> shows print queue. <code>mailq</code> shows queued outgoing mail. <code>atq</code> shows scheduled at jobs.',
    children:[
      {id:'var-spool-cron',name:'cron/',cat:'var',label:'cron/',
       type:'user crontab files',
       role:'Per-user crontab files managed by crontab(1). One file per user, named by username.',
       desc:'Never edit these directly — always use crontab -e which validates syntax and signals cron to reload. Root\'s crontab is here too. Files are owned by root but mode-protected; crontab command runs setuid to write them safely.',
       perms:'drwx------  root crontab  (1730)',
       files:['root','ubuntu','alice','bob','www-data','deploy'],
       tip:'<code>crontab -l</code> lists your cron jobs. <code>for user in $(cut -f1 -d: /etc/passwd); do crontab -l -u $user 2>/dev/null && echo "=== $user"; done</code> lists all users\' crontabs.'},
      {id:'var-spool-mail',name:'mail/',cat:'var',label:'mail/',
       type:'local user mailboxes (mbox)',
       role:'Local mbox format mailboxes for system mail delivery. One file per user.',
       desc:'System daemons and cron jobs deliver mail here via sendmail/postfix local delivery. Each file is an mbox file with multiple messages separated by "From " lines. Common recipients: root (system alerts), www-data (web app errors), cron output if not redirected.',
       perms:'drwxrwsr-x  root mail  (2775)',
       files:['root','ubuntu','alice'],
       tip:'<code>sudo mail -u root</code> reads root\'s system mail. <code>cat /var/spool/mail/root</code> reads it directly.'},
      {id:'var-spool-cups',name:'cups/',cat:'var',label:'cups/',
       type:'CUPS print queue',
       role:'CUPS printer subsystem spool: queued print jobs, per-job data files, and PPD cache.',
       desc:'Each print job consists of paired files: c00001 (job control/metadata: printer, user, title, copies, options) and d00001-001 (job data in PostScript/PDF). The CUPS scheduler processes them in order, sending to the printer driver backend.',
       perms:'drwx--x---  root lp',
       files:['cache/','ppd/','tmp/','c00001','d00001-001'],
       tip:'<code>lpstat -W not-completed</code> shows pending jobs. <code>cancel -a</code> cancels all jobs. <code>cupsenable printername</code> re-enables.'},
    ]},

   // ── /var/cache ──
   {id:'var-cache',name:'/var/cache',cat:'var',label:'cache/',
    type:'persistent application cache',
    role:'Cached data from applications. Safe to delete — will be regenerated at cost of performance.',
    desc:'apt stores downloaded .deb packages here. Man page cache (catman), font cache (fontconfig), and ldconfig cache (ld.so.cache) also live here. Regular cache cleanup can recover significant disk space.',
    perms:'drwxr-xr-x  root root',
    files:['apt/','apt/archives/','apt/archives/partial/','apt/pkgcache.bin','apt/srcpkgcache.bin','man/','fontconfig/','debconf/','ldconfig/','snapd/','apparmor/','bind/'],
    tip:'<code>apt clean</code> removes all downloaded .deb files. <code>apt autoclean</code> removes only outdated ones.',
    children:[
      {id:'var-cache-apt',name:'apt/archives/',cat:'var',label:'apt/archives/',
       type:'downloaded .deb packages',
       role:'Downloaded .deb package files — cached locally after installation.',
       desc:'apt download stores packages here before installing. After installation they remain as local cache — useful for reinstalling without re-downloading or for offline deployment. partial/ holds incomplete downloads. lock file prevents concurrent apt runs.',
       perms:'drwxr-xr-x  root root',
       files:['*.deb','partial/','lock'],
       tip:'<code>apt clean</code> clears all cached debs. <code>du -sh /var/cache/apt/archives/</code> shows cache size. <code>apt-get download packagename</code> downloads without installing.'},
    ]},

   // ── /var/lib ──
   {id:'var-lib',name:'/var/lib',cat:'var',label:'lib/',
    type:'persistent application state',
    role:'Persistent application state data that must survive reboots but is not user config.',
    desc:'Database files, package manager state, container data, and application runtime data. Applications create their own subdirectory here. Unlike /etc, this is machine-generated data not meant for hand-editing.',
    perms:'drwxr-xr-x  root root',
    files:['dpkg/','apt/','apt/lists/','mysql/','postgresql/','redis/','mongodb/','elasticsearch/','docker/','containerd/','lxc/','lxd/','snapd/','flatpak/','systemd/','NetworkManager/','cloud/','cloud-init/','ufw/','fail2ban/','sudo/'],
    tip:'<code>du -sh /var/lib/*/ | sort -rh | head -20</code> shows which apps use most persistent state.',
    children:[
      {id:'var-lib-dpkg',name:'dpkg/',cat:'var',label:'dpkg/',
       type:'dpkg package manager state',
       role:'dpkg\'s database of all installed packages, their file lists, and maintainer scripts.',
       desc:'status: one stanza per installed/removed/purged package (Name, Version, Architecture, Status, Depends, etc.). info/: per-package files — <pkg>.list (all installed files), <pkg>.md5sums, <pkg>.conffiles, <pkg>.preinst/.postinst/.prerm/.postrm (maintainer scripts). alternatives/: update-alternatives symlink config.',
       perms:'drwxr-xr-x  root root',
       files:['status','status-old','available','lock','lock-frontend','info/','updates/','triggers/','alternatives/'],
       tip:'<code>dpkg -L packagename</code> lists all files installed by a package. <code>dpkg -S /path/to/file</code> finds which package owns a file.'},
      {id:'var-lib-systemd',name:'systemd/',cat:'var',label:'systemd/',
       type:'systemd persistent state',
       role:'systemd persistent state: random seed, machine ID, coredump metadata, timer last-run times.',
       desc:'random-seed: written at shutdown to fast-initialize the PRNG at next boot. timers/: last-run timestamps for systemd timers (prevents missed runs on restart). coredump/: metadata for coredumps (actual cores in /var/lib/systemd/coredump/ or /var/coredump/). catalog/: message ID to human description mappings.',
       perms:'drwxr-xr-x  root root',
       files:['random-seed','timers/','coredump/','catalog/','rfkill/','backlight/','linger/','pstore/'],
       tip:'<code>coredumpctl list</code> shows coredumps. <code>coredumpctl info</code> shows most recent coredump info. <code>coredumpctl gdb</code> opens in gdb.'},
      {id:'var-lib-docker',name:'docker/',cat:'var',label:'docker/',
       type:'Docker runtime data',
       role:'All Docker runtime data: image layers, container filesystems, volumes, and network configs.',
       desc:'overlay2/: image layers and container filesystems using OverlayFS storage driver. volumes/: named Docker volume data. image/: content-addressable image metadata and layer digests. containers/: per-container config, logs, and state. network/: Docker network configs. buildkit/: BuildKit build cache.',
       perms:'drwx--x--x  root root',
       files:['overlay2/','volumes/','image/','containers/','network/','swarm/','buildkit/','tmp/','plugins/','runtimes/','containerd/'],
       tip:'<code>docker system df</code> shows disk usage breakdown. <code>docker system prune -a</code> cleans up unused images, containers, networks, volumes.'},
      {id:'var-lib-mysql-data',name:'mysql/',cat:'var',label:'mysql/',
       type:'MySQL/MariaDB data directory',
       role:'MySQL database files: table data, InnoDB tablespace, binary logs, and InnoDB redo logs.',
       desc:'Each database is a subdirectory (except InnoDB shared tablespace). InnoDB: ibdata1 (shared tablespace, undo logs), ib_logfile0/1 (redo log files), *.ibd (per-table tablespaces with innodb_file_per_table). MyISAM: .frm (table structure), .MYD (data), .MYI (index). Binary logs (mysql-bin.000001+): row or statement replication logs.',
       perms:'drwxr-xr-x  mysql mysql  (700)',
       files:['mysql/','performance_schema/','information_schema/','sys/','ibdata1','ib_logfile0','ib_logfile1','ib_buffer_pool','mysql.err','mysql-bin.000001','mysql-bin.index','aria_log_control'],
       tip:'<code>mysqlcheck -A -u root -p</code> checks all databases. <code>innochecksum</code> verifies InnoDB tablespace integrity.'},
      {id:'var-lib-sudo',name:'sudo/',cat:'var',label:'sudo/',
       type:'sudo state files',
       role:'sudo authentication cache timestamps and lecture tracking.',
       desc:'lectured/: empty files per-username marking that the user has seen the sudo security lecture. ts/: timestamp files that cache successful sudo authentication (default 5 minutes). The timestamp mechanism is what lets you run sudo multiple times without re-entering your password.',
       perms:'drwxr-xr-x  root root',
       files:['lectured/','lectured/alice','ts/','ts/alice'],
       tip:'<code>sudo -K</code> immediately invalidates your sudo timestamp. <code>sudo -k</code> marks it as expired (re-prompts next time).'},
    ]},

   // ── /var/www ──
   {id:'var-www',name:'/var/www',cat:'var',label:'www/',
    type:'web server document root',
    role:'Default document root for web servers (nginx/apache). Served files live here.',
    desc:'html/ is the default root served by nginx/apache default vhosts. Production deployments typically point virtual hosts to subdirectories here. The web server user (www-data on Debian/Ubuntu, nginx on RHEL) needs read access.',
    perms:'drwxr-xr-x  root root',
    files:['html/','html/index.html','html/index.nginx-debian.html'],
    tip:'<code>chown -R www-data:www-data /var/www/mysite/</code> sets web server ownership. Use setfacl for more granular control.'},

   // ── /var/mail ──
   {id:'var-mail',name:'/var/mail',cat:'var',label:'mail/',
    type:'local user mailboxes',
    role:'Local mbox mailboxes for system mail delivery. One file per user.',
    desc:'Receives mail from cron (job output), system daemons, logwatch, and local postfix/sendmail. Sysadmins should forward root\'s mail to a real address via /etc/aliases then run newaliases.',
    perms:'drwxrwsr-x  root mail  (2775)',
    files:['root','ubuntu','alice'],
    tip:'<code>sudo mail -u root</code> reads root\'s system mail. Set up forwarding: add "root: admin@example.com" to /etc/aliases then run <code>newaliases</code>.'},

   ]},// end /var children

  //───────────── /home ─────────────
  {id:'home',name:'/home',cat:'user',label:'/home',
   type:'user home directories',
   role:'Personal directories for regular users.',
   desc:'Typically on its own partition so user data survives an OS reinstallation. Contains dotfiles (hidden config files), documents, downloads, and personal data. The $HOME variable points here.',
   perms:'drwxr-xr-x  root root  (755)',
   files:['alice/','bob/','ubuntu/'],
   tip:'<code>ls -la ~</code> shows all dotfiles. <code>du -sh ~/*</code> shows space usage by directory.',
   children:[
     {id:'home-bashrc',name:'~/.bashrc',cat:'user',label:'~/.bashrc',
      type:'shell configuration',
      role:'Per-user shell configuration sourced on every interactive non-login shell.',
      desc:'.bashrc: runs for interactive non-login shells (terminal emulator tabs). .bash_profile / .profile: run for login shells (SSH, TTY logins). .profile is POSIX sh compatible (dash/sh also sources it). .bash_logout: runs when a bash login shell exits — rarely used.',
      perms:'-rw-r--r--  user user  (644)',
      files:['.bashrc','.bash_profile','.profile','.zshrc','.zshenv','.zsh_history','.bash_history','.bash_logout','.inputrc','.vimrc','.vim/','.nanorc','.tmux.conf','.screenrc','.gitconfig','.gitignore_global','.editorconfig','.curlrc','.wgetrc','.npmrc','.gemrc','.Xresources','.xinitrc'],
      tip:'<code>source ~/.bashrc</code> reloads without opening a new shell. HISTFILESIZE=0 disables history (check for this as attacker evasion).'},
     {id:'home-ssh',name:'~/.ssh',cat:'user',label:'~/.ssh/',
      type:'SSH keys & client config',
      role:'Per-user SSH private keys, authorized public keys, known_hosts, and client configuration.',
      desc:'Mode 700 (directory) and 600 (private keys) required — SSH refuses keys with wrong permissions. authorized_keys: public keys permitted to authenticate as this user. known_hosts: cached server fingerprints (TOFU trust model). config: per-host settings.',
      perms:'drwx------  user user  (700)',
      files:['id_rsa','id_rsa.pub','id_ed25519','id_ed25519.pub','id_ecdsa','id_ecdsa.pub','authorized_keys','known_hosts','known_hosts.old','config','environment'],
      tip:'<code>ssh-keygen -t ed25519 -C "user@host"</code> generates a modern keypair. <code>ssh-copy-id -i ~/.ssh/id_ed25519.pub user@server</code> installs your key.',
      children:[
        {id:'home-ssh-config',name:'~/.ssh/config',cat:'user',label:'config',
         type:'SSH client config',
         role:'Per-user SSH client configuration: per-host connection settings, aliases, proxies.',
         desc:'Host blocks set per-host defaults. Options: HostName (real hostname/IP), User (login username), Port, IdentityFile (~/.ssh/mykey), ForwardAgent yes, StrictHostKeyChecking no (DANGEROUS), ProxyJump bastion-host (for multi-hop SSH), ServerAliveInterval 60, Compression yes, ControlMaster auto (connection multiplexing).',
         perms:'-rw-------  user user  (600)',
         files:[],
         tip:'Add a Host block to alias <code>ssh myserver</code> instead of typing the full command every time. Host blocks with wildcards (* or ?) set defaults for multiple hosts.'},
        {id:'home-ssh-authorized',name:'authorized_keys',cat:'user',label:'authorized_keys',
         type:'authorised SSH public keys',
         role:'Public keys allowed to authenticate as this user over SSH without a password.',
         desc:'One public key per line. Options prefix (before keytype): from="ip/hostname" (restrict source), command="cmd" (force command execution), no-port-forwarding, no-agent-forwarding, no-X11-forwarding, restrict (deny all forwarding). The SSH daemon checks this file for public key authentication.',
         perms:'-rw-------  user user  (600)',
         files:[],
         tip:'<code>ssh-keygen -lf ~/.ssh/authorized_keys</code> shows key fingerprints. Check regularly for unauthorized keys added by attackers.'},
        {id:'home-ssh-known',name:'known_hosts',cat:'user',label:'known_hosts',
         type:'SSH host fingerprint cache',
         role:'Fingerprints of every SSH server this user has connected to. TOFU trust model.',
         desc:'One line per known host: hostname[,IP] keytype base64-fingerprint. With HashKnownHosts=yes (recommended): hostname is hashed to |1|SALT|HASH format for privacy. If a server\'s key changes (upgrade, compromise, MITM), SSH warns "REMOTE HOST IDENTIFICATION HAS CHANGED".',
         perms:'-rw-------  user user  (600)',
         files:[],
         tip:'<code>ssh-keygen -R hostname</code> removes a stale host key. <code>ssh-keygen -H</code> hashes all plain-text hostnames in known_hosts.'},
      ]},
     {id:'home-config',name:'~/.config',cat:'user',label:'~/.config/',
      type:'XDG application config',
      role:'XDG Base Directory spec: standardised per-user application configuration directory.',
      desc:'The XDG Base Directory spec moved away from scattered ~/.appname dotfiles. Applications store config here in their own named subdirectory. $XDG_CONFIG_HOME defaults to ~/.config. Complements ~/.local/share (data) and ~/.cache (cache).',
      perms:'drwx------  user user',
      files:['git/','git/config','htop/','htop/htoprc','systemd/user/','dconf/','gtk-3.0/','gtk-4.0/','fish/','alacritty/','kitty/','nvim/','Code/','chromium/','google-chrome/','firefox/','pulse/','pipewire/','autostart/'],
      tip:'<code>ls ~/.config/</code> shows all XDG-compliant app configs. <code>$XDG_CONFIG_HOME</code> env var can override the path.',
      children:[
        {id:'home-config-autostart',name:'autostart/',cat:'user',label:'autostart/',
         type:'XDG autostart entries',
         role:'Desktop entry files (.desktop) for applications that start automatically when the user logs in.',
         desc:'Each .desktop file defines: Exec= (command to run), Name= (display name), Hidden=false (enabled), OnlyShowIn= / NotShowIn= (DE-specific). Processed by GNOME, KDE, XFCE, and other XDG-compliant desktop environments at session start. System-wide autostart is in /etc/xdg/autostart/.',
         perms:'drwxr-xr-x  user user',
         files:['*.desktop','dropbox.desktop','nm-applet.desktop','blueman-applet.desktop'],
         tip:'Common persistence vector: attackers drop a .desktop file here for persistent execution at every user login. <code>ls ~/.config/autostart/</code> to audit.'},
        {id:'home-config-systemd-user',name:'systemd/user/',cat:'user',label:'systemd/user/',
         type:'user systemd services',
         role:'Per-user systemd unit files for the user\'s systemd session manager.',
         desc:'Users can run their own systemd service manager (systemd --user) without root. Units here are started/stopped with systemctl --user. Common uses: persistent user processes (syncthing, ssh-agent), scheduled user tasks (systemd timers), auto-restarting user services.',
         perms:'drwxr-xr-x  user user',
         files:['*.service','*.timer','*.socket','syncthing.service','default.target.wants/'],
         tip:'<code>systemctl --user status</code> shows user services. <code>systemctl --user enable --now syncthing.service</code> starts a user service.'},
      ]},
     {id:'home-local',name:'~/.local',cat:'user',label:'~/.local/',
      type:'XDG user data & local installs',
      role:'User-local application data, executables, and state (XDG Base Directory Specification).',
      desc:'bin/: user-installed executables (pip --user, pipx, cargo install, npm -g). share/: application data (desktop entries, fonts, icons, themes). lib/: language package trees (Python site-packages). state/: persistent state that isn\'t important enough for share/ (nvim shada, bash session state).',
      perms:'drwxr-xr-x  user user',
      files:['bin/','share/','share/applications/','share/fonts/','share/icons/','share/themes/','lib/','lib/python3.12/','lib/python3.12/site-packages/','state/'],
      tip:'Add <code>export PATH="$HOME/.local/bin:$PATH"</code> to ~/.bashrc to use user-installed tools.',
      children:[
        {id:'home-local-bin',name:'~/.local/bin',cat:'user',label:'bin/',
         type:'user-installed executables',
         role:'Executables installed by user-level package managers: pipx, cargo, npm -g, go install.',
         desc:'pipx installs Python CLI tools here in isolated venvs. cargo install --root ~/.local installs Rust binaries. go install installs Go binaries. Scripts placed here manually. Takes precedence over /usr/local/bin and /usr/bin if added to PATH first.',
         perms:'drwxr-xr-x  user user',
         files:['pipx-managed/','black','ruff','pre-commit','httpie','youtube-dl','yt-dlp','bat','fd','ripgrep','exa','delta','gh'],
         tip:'<code>pipx list</code> shows pipx-managed tools. <code>cargo install --list</code> shows cargo-installed binaries.'},
        {id:'home-local-share',name:'~/.local/share',cat:'user',label:'share/',
         type:'XDG user application data',
         role:'User-specific application data: desktop entries, fonts, icons, recently-used files.',
         desc:'.desktop files in applications/ appear in application launchers. Fonts in fonts/: installed per-user, no root needed. recently-used.xbel: XML file tracking recently opened files (used by file pickers). Trash/: user\'s trash bin (files/ and info/ subdirs). flatpak/: Flatpak app data and runtimes.',
         perms:'drwxr-xr-x  user user',
         files:['applications/','fonts/','icons/','themes/','recently-used.xbel','Trash/','Trash/files/','Trash/info/','gnome-shell/','flatpak/','pipx/','jupyter/'],
         tip:'<code>fc-cache -fv ~/.local/share/fonts/</code> registers user-installed fonts. <code>gio trash --list</code> shows trash contents.'},
      ]},
   ]},

  //───────────── /root ─────────────
  {id:'root-home',name:'/root',cat:'user',label:'/root',
   type:'root home directory',
   role:'The home directory of the root superuser. Deliberately not inside /home.',
   desc:'Kept outside /home so root can always access it even if /home is on a separate unmounted partition. Mode 700 — only root can read it. Contains root\'s SSH keys, shell config, and admin scripts.',
   perms:'drwx------  root root  (700)',
   files:['.bashrc','.bash_history','.profile','.bash_profile','.ssh/','.vimrc','.selected_editor','snap/','.ansible/'],
   tip:'<code>sudo -i</code> opens a root shell with root\'s full environment from /root. <code>sudo cat /root/.bash_history</code> shows root\'s command history.'},

  //───────────── /dev ─────────────
  {id:'dev',name:'/dev',cat:'device',label:'/dev',badge:'devtmpfs',
   type:'device file tree',
   role:'Device files — the kernel\'s interface to hardware and pseudo-devices. Everything in Linux is a file.',
   desc:'Managed by udev (hotplug) and devtmpfs (created by kernel at boot). Files created/removed dynamically. Block devices (b): transfer fixed-size blocks (disks). Character devices (c): transfer bytes (terminals, serial). udev runs rules from /usr/lib/udev/rules.d/ and /etc/udev/rules.d/ on each device event.',
   perms:'drwxr-xr-x  root root  (devtmpfs)',
   files:['null','zero','random','urandom','full','mem','kmem','port','stdin','stdout','stderr','tty','console','tty0-63','ttyS0-3','ttyUSB0','sda','sda1','sda2','sdb','nvme0n1','nvme0n1p1','vda','loop0-7','mapper/','disk/','input/','pts/','shm/','dri/','net/','mqueue/','hugepages/','tpm0','tpmrm0'],
   tip:'<code>ls -la /dev/sd*</code> shows disks. <code>lsblk -f</code> shows filesystem types. <code>udevadm monitor</code> watches device events.',
   children:[
     {id:'dev-null-zero',name:'/dev/null',cat:'device',label:'null/zero/mem',
      type:'pseudo character devices',
      role:'/dev/null: bit bucket. /dev/zero: infinite null bytes. /dev/urandom: CSPRNG. /dev/mem: physical RAM access.',
      desc:'/dev/null: discards all writes, returns EOF on read. /dev/zero: returns infinite zero bytes on read — used to create blank files or wipe. /dev/urandom: CSPRNG output, non-blocking (safe for cryptographic use). /dev/random: same entropy pool as urandom on Linux 5.6+. /dev/full: returns ENOSPC on write (testing error handling). /dev/mem: physical RAM — requires CAP_SYS_RAWIO, rootkit attack vector.',
      perms:'crw-rw-rw-  root root  1,3',
      files:['null','zero','full','urandom','random','mem','kmem','port'],
      tip:'<code>cmd > /dev/null 2>&1</code> silences all output. <code>dd if=/dev/urandom bs=16 count=1 | xxd</code> generates random hex.'},
     {id:'dev-disk-nodes',name:'/dev/sdX',cat:'device',label:'sdX/nvme/md',
      type:'block device files',
      role:'Block device files for physical storage, NVMe drives, partitions, MD RAID arrays, and LVM.',
      desc:'SATA/SCSI: sda, sdb... (alphabetical order of detection). NVMe: nvme0n1 (drive 0, namespace 1). Partitions append number: sda1, nvme0n1p1. Virtio (VM): vda, vdb. MMC/SD: mmcblk0, mmcblk0p1. MD RAID: md0, md1. Device mapper (LVM/LUKS): in /dev/mapper/. loop devices mount image files (.img, .iso).',
      perms:'brw-rw----  root disk  8,0',
      files:['sda','sda1','sda2','sdb','nvme0n1','nvme0n1p1','nvme0n1p2','vda','vda1','mmcblk0','mmcblk0p1','md0','md1','loop0','loop1','loop2'],
      tip:'<code>lsblk -f</code> shows all block devices with filesystem types, UUIDs, and mount points.',
      children:[
        {id:'dev-mapper',name:'/dev/mapper',cat:'device',label:'mapper/',
         type:'device mapper virtual devices',
         role:'Device mapper virtual block devices: LVM logical volumes, LUKS encrypted disks, dm-multipath.',
         desc:'LVM creates entries named <vg>-<lv> (e.g. ubuntu--vg-ubuntu--lv). LUKS dm-crypt creates the decrypted block device here after unlocking with cryptsetup open. Docker uses thin-pool targets. multipath creates redundant path devices.',
         perms:'drwxr-xr-x  root root',
         files:['ubuntu--vg-ubuntu--lv','control','cryptroot','docker-thinpool','docker-thinpool-tdata','docker-thinpool-tmeta'],
         tip:'<code>dmsetup ls --tree</code> shows the full device mapper topology. <code>lvdisplay</code> shows LVM logical volumes.'},
        {id:'dev-disk-by',name:'/dev/disk/by-*',cat:'device',label:'disk/by-*',
         type:'stable device symlinks',
         role:'Stable persistent symlinks to disks and partitions: by UUID, label, hardware ID, and path.',
         desc:'by-uuid/: UUIDs (ext4/xfs/btrfs filesystem UUID) — stable even if disk is moved. by-partuuid/: GPT partition UUIDs. by-label/: filesystem labels. by-id/: hardware serial number + partition (wwn-xxx, ata-xxx). by-path/: hardware bus path. Use UUID= in /etc/fstab for stability.',
         perms:'drwxr-xr-x  root root',
         files:['by-uuid/','by-label/','by-id/','by-path/','by-partlabel/','by-partuuid/'],
         tip:'<code>ls -la /dev/disk/by-uuid/</code> maps UUIDs to device files. <code>blkid /dev/sda1</code> shows all identifiers for a partition.'},
      ]},
     {id:'dev-tty-pts',name:'/dev/tty',cat:'device',label:'tty/pts',
      type:'terminal character devices',
      role:'Terminal devices (physical/virtual) and pseudo-terminals (one per SSH session/terminal window).',
      desc:'/dev/tty: the controlling terminal of the current process. /dev/tty0-N: virtual terminal devices (Ctrl+Alt+F1 etc.). /dev/ttyS0-N: serial ports (RS-232). /dev/ttyUSB0: USB serial adapters. /dev/pts/: pseudo-terminal slave devices — one per SSH session, terminal emulator, tmux/screen pane. /dev/pts/ptmx: master side.',
      perms:'crw-rw-rw-  root tty  5,0',
      files:['tty','console','tty0','tty1','tty2','ttyS0','ttyS1','ttyUSB0','pts/','pts/0','pts/1','pts/2','pts/ptmx'],
      tip:'<code>tty</code> shows your current terminal device. <code>who</code> shows all users and their terminals. <code>w</code> shows activity too.'},
     {id:'dev-shm-node',name:'/dev/shm',cat:'device',label:'shm/',badge:'tmpfs',
      type:'POSIX shared memory',
      role:'POSIX shared memory objects backed by RAM. Fast zero-copy IPC between processes.',
      desc:'A tmpfs mount at /dev/shm. Processes create named shared memory segments via shm_open(3). Much faster than file-based IPC (no disk I/O). Heavy users: PostgreSQL (shared_buffers), Redis, Chromium/browsers, libdbus. Default size is usually 50% of RAM. Can be mounted with specific size limit.',
      perms:'drwxrwxrwt  root root  (sticky, tmpfs)',
      files:[],
      tip:'<code>ls -la /dev/shm/</code> shows active shared memory objects. <code>df -h /dev/shm</code> shows usage. Postgres creates many small segments.'},
     {id:'dev-input',name:'/dev/input',cat:'device',label:'input/',
      type:'input event devices',
      role:'Character device files for keyboard, mouse, touchpad, joystick, and touchscreen events.',
      desc:'Each input device gets an eventN file. The evdev subsystem provides a generic event interface. X11/Wayland/libinput read from these. by-id/ and by-path/ provide stable names. /dev/input/mice: virtual merged mouse device (all mice). Readable by members of the "input" group.',
      perms:'drwxr-xr-x  root root',
      files:['event0','event1','event2','event3','event4','mouse0','mouse1','mice','js0','by-id/','by-path/'],
      tip:'<code>evtest /dev/input/event0</code> shows raw input events. <code>udevadm info -a -n /dev/input/event0</code> identifies the device.'},
     {id:'dev-dri',name:'/dev/dri',cat:'device',label:'dri/',
      type:'DRM/GPU device files',
      role:'Direct Rendering Manager device files for GPU access.',
      desc:'cardN: privileged DRM device — modesetting, display configuration. Writable only by root and video group. renderDN: render-only device for GPU compute/rendering without display access. Accessible by render group (no display privilege required). Used by Vulkan, OpenGL via Mesa, Wayland compositors.',
      perms:'drwxr-xr-x  root root',
      files:['card0','card1','renderD128','renderD129','by-path/'],
      tip:'<code>ls -la /dev/dri/</code> shows GPU devices. <code>groups</code> shows if you\'re in the video/render groups for GPU access.'},
     {id:'dev-tpm',name:'/dev/tpm0',cat:'device',label:'tpm0/tpmrm0',
      type:'TPM security module',
      role:'Trusted Platform Module device for hardware-based cryptography and Secure Boot attestation.',
      desc:'/dev/tpm0: Direct TPM access via ioctl — requires root or tss group membership. /dev/tpmrm0: TPM Resource Manager — multiplexes concurrent access (preferred). Used for: Secure Boot chain of trust measurement (PCR banks), disk encryption key sealing (BitLocker-style), SSH key storage, attestation.',
      perms:'crw-rw----  root tss',
      files:['tpm0','tpmrm0'],
      tip:'<code>tpm2_getcap properties-fixed</code> shows TPM capabilities. <code>tpm2_pcrread sha256:0</code> reads PCR 0 (firmware measurement).'},
   ]},

  //───────────── /proc ─────────────
  {id:'proc',name:'/proc',cat:'device',label:'/proc',badge:'procfs (virtual)',
   type:'kernel/process information fs',
   role:'Virtual filesystem — a real-time window into the running kernel and every live process.',
   desc:'Nothing stored on disk. The kernel generates file content on-the-fly when read. Writable files allow runtime kernel tuning via sysctl. ps, top, free, df, lsmod, strace, ss all read /proc. Also the basis for all Linux system monitoring tools.',
   perms:'dr-xr-xr-x  root root  (procfs)',
   files:['cpuinfo','meminfo','version','uptime','loadavg','filesystems','mounts','partitions','diskstats','net/','sys/','kallsyms','kcore','modules','cmdline','stat','swaps','vmstat','interrupts','iomem','ioports','crypto','locks','misc','buddyinfo','slabinfo','mdstat','scsi/'],
   tip:'<code>ls /proc/</code> shows PIDs as numbered dirs plus named virtual files. <code>cat /proc/version</code> shows kernel version and build info.',
   children:[
     {id:'proc-cpuinfo',name:'/proc/cpuinfo',cat:'device',label:'cpuinfo',
      type:'live CPU information',
      role:'Live CPU details: model, core count, current clock speed, feature flags per logical CPU.',
      desc:'Each block is one logical CPU (processor: N). Key fields: model name (CPU model string), cpu MHz (current frequency — may vary with frequency scaling), cpu cores (physical cores), siblings (logical CPUs including hyperthreads), flags (feature bits — critical for security: pti=Meltdown mitigation, ssbd=Spectre v4, ibrs/ibpb=Spectre v2, md_clear=MDS).',
      perms:'-r--r--r--  root root',
      files:[],
      tip:'<code>grep "model name" /proc/cpuinfo | uniq</code> shows CPU model. <code>grep "flags" /proc/cpuinfo | tr " " "\n" | grep "pti\|ibrs\|ssbd"</code> checks CPU mitigations.'},
     {id:'proc-meminfo',name:'/proc/meminfo',cat:'device',label:'meminfo',
      type:'live memory statistics',
      role:'Live memory statistics: total, free, available, cached, buffers, swap, huge pages.',
      desc:'Key fields: MemTotal (total physical RAM), MemFree (genuinely unused), MemAvailable (free + reclaimable cache — what programs can actually use without swapping), Buffers (kernel I/O buffer cache), Cached (page cache), SwapTotal/SwapFree, HugePages_Total/Free (hugepage allocation), Dirty (pages awaiting writeback), Mapped (memory-mapped files). free, htop, vmstat, top all read from here.',
      perms:'-r--r--r--  root root',
      files:[],
      tip:'<code>grep "MemAvailable" /proc/meminfo</code> shows truly available memory. <code>vmstat -s</code> provides a formatted summary.'},
     {id:'proc-loadavg',name:'/proc/loadavg',cat:'device',label:'loadavg',
      type:'system load averages',
      role:'1, 5, and 15-minute load averages plus current running/total processes and last PID.',
      desc:'Format: 1min 5min 15min running_processes/total_processes last_new_pid. Load = average number of runnable (R state) + uninterruptible sleeping (D state) processes. Values above CPU count = saturation. D state processes (blocked on I/O) inflate load even without CPU pressure. uptime, top, w read from here.',
      perms:'-r--r--r--  root root',
      files:[],
      tip:'<code>cat /proc/loadavg</code> — value > number of CPUs means overloaded. <code>nproc</code> shows CPU count for comparison.'},
     {id:'proc-pid-dir',name:'/proc/[PID]',cat:'device',label:'[PID]/',
      type:'per-process state directory',
      role:'A directory for every running process named by PID. Contains the entire process state.',
      desc:'Exists for every process including kernel threads. Contains: cmdline (command and arguments), environ (environment variables), fd/ (open file descriptors), maps (virtual memory map), status (human-readable state and resource usage), stat (machine-readable stats for top), cwd (working directory), exe (executable path), net/ (namespace-specific network state).',
      perms:'dr-xr-xr-x  owner owner',
      files:['cmdline','comm','environ','exe','cwd','fd/','fdinfo/','maps','smaps','smaps_rollup','status','stat','statm','net/','ns/','oom_adj','oom_score','oom_score_adj','limits','loginuid','sessionid','task/','wchan','io','mem','pagemap','attr/','coredump_filter','cgroup','syscall','mountinfo'],
      tip:'<code>ls -la /proc/$$/fd/</code> shows your shell\'s open file descriptors. <code>cat /proc/$$/status</code> shows your shell\'s state.',
      children:[
        {id:'proc-pid-fd',name:'fd/',cat:'device',label:'fd/',
         type:'open file descriptors',
         role:'Symlinks to every file, socket, pipe, or device currently open by this process.',
         desc:'0 → stdin, 1 → stdout, 2 → stderr. Then numbered from 3+. Symlink targets: real file paths, "socket:[inode]" for network sockets, "pipe:[inode]" for pipes, "anon_inode:[eventfd]" for special kernel objects. lsof and fuser read from here. FD leak check: count open FDs and watch for growth.',
         perms:'dr-x------  owner owner',
         files:['0 → /dev/pts/0','1 → /dev/pts/0','2 → /dev/pts/0','3 → socket:[12345]','4 → pipe:[67890]','5 → /var/log/app.log'],
         tip:'<code>ls /proc/$$/fd | wc -l</code> counts open FDs. <code>ls -la /proc/<pid>/fd/ | grep socket</code> shows open network connections.'},
        {id:'proc-pid-maps',name:'maps',cat:'device',label:'maps',
         type:'virtual memory area map',
         role:'Virtual address space layout: every memory region the process has mapped.',
         desc:'Columns: start-end address, permissions (r/w/x/p-private or s-shared), offset, device (major:minor), inode, pathname (or [heap], [stack], [vdso], [vsyscall], anonymous). Shows: executable code (.text r-xp), data (.data rw-p), heap ([heap] rw-p), stack ([stack] rw-p), shared libraries, memory-mapped files, ASLR layout.',
         perms:'-r--r--r--  owner owner',
         files:[],
         tip:'<code>cat /proc/$$/maps</code> shows your shell\'s memory layout. <code>pmap -x <pid></code> provides a formatted view with sizes.'},
        {id:'proc-pid-status',name:'status',cat:'device',label:'status',
         type:'process status summary',
         role:'Human-readable process state: name, PID, memory usage, UIDs/GIDs, capabilities, threads.',
         desc:'Key fields: State (R=running, S=sleeping, D=uninterruptible, Z=zombie, T=stopped), VmRSS (resident memory), VmPeak (peak virtual memory), VmSwap (swapped memory), Threads, Uid/Gid (real/effective/saved/filesystem UID and GID), CapInh/CapPrm/CapEff/CapBnd/CapAmb (capability bitmasks).',
         perms:'-r--r--r--  owner owner',
         files:[],
         tip:'<code>grep "Vm\|Cap\|State\|Pid" /proc/<pid>/status</code> shows memory and capabilities. Decode caps: <code>capsh --decode=$(grep CapEff /proc/$$/status | awk \'{print $2}\')</code>'},
        {id:'proc-pid-ns',name:'ns/',cat:'device',label:'ns/',
         type:'namespace symlinks',
         role:'Symlinks to the namespace instances this process belongs to.',
         desc:'Symlinks: cgroup, ipc, mnt (mount), net (network), pid, pid_for_children, time, time_for_children, user (user namespace), uts (hostname/domain). Two processes sharing a namespace have symlinks pointing to the same inode number. Used to detect container isolation (compare ns/net inode with PID 1\'s).',
         perms:'dr-x--x--x  owner owner',
         files:['cgroup','ipc','mnt','net','pid','pid_for_children','time','time_for_children','user','uts'],
         tip:'<code>ls -la /proc/$$/ns/</code> shows your namespaces. <code>ls -la /proc/1/ns/</code> shows init\'s. Compare inode numbers to see if in same namespace.'},
        {id:'proc-pid-loginuid',name:'loginuid',cat:'device',label:'loginuid',
         type:'audit login UID',
         role:'The original login UID of the process chain. Immutable once set — survives privilege escalation.',
         desc:'Set once by PAM at login and cannot be changed by the process itself (even root). If a user logs in as alice (UID 1000) and then sudo su to root (UID 0), the loginuid still shows 1000. Used by the audit subsystem to attribute privileged actions back to the original human user. Forensic goldmine.',
         perms:'-rw-r--r--  root root',
         files:[],
         tip:'<code>cat /proc/$$/loginuid</code> shows your session\'s login UID. <code>ausearch --loginuid 1000</code> finds all audit events for that user.'},
        {id:'proc-pid-cgroup',name:'cgroup',cat:'device',label:'cgroup',
         type:'cgroup membership',
         role:'Shows which cgroup hierarchy entries this process belongs to.',
         desc:'Format: hierarchy-ID:controller-list:cgroup-path. Example: 0::/system.slice/nginx.service (cgroup v2 unified hierarchy). Shows which systemd service/scope/slice owns the process, which Docker container it\'s in, and resource control group membership. Used by: systemd, Docker, Kubernetes, LXC.',
         perms:'-r--r--r--  owner owner',
         files:[],
         tip:'<code>cat /proc/$$/cgroup</code> shows your shell\'s cgroup. <code>cat /proc/1/cgroup</code> shows init\'s. Compare to identify container vs host processes.'},
        {id:'proc-pid-io',name:'io',cat:'device',label:'io',
         type:'process I/O statistics',
         role:'Per-process I/O accounting: bytes read/written to storage and the kernel I/O layer.',
         desc:'Fields: rchar (bytes read — includes pagecache), wchar (bytes written), syscr (read syscall count), syscw (write syscall count), read_bytes (bytes actually read from storage), write_bytes (bytes actually written), cancelled_write_bytes (writes cancelled by truncation). iotop reads from here.',
         perms:'-r--------  owner owner (requires root for other processes)',
         files:[],
         tip:'<code>sudo cat /proc/<pid>/io</code> shows I/O stats (root needed for other processes). <code>iotop -p <pid></code> monitors live.'},
        {id:'proc-pid-oom',name:'oom_score',cat:'device',label:'oom_score',
         type:'OOM killer score',
         role:'The process\'s OOM killer score (0–1000). Higher = more likely to be killed under memory pressure.',
         desc:'oom_score: computed dynamically by kernel (based on memory usage, runtime, nice value). oom_score_adj: -1000 (never kill) to +1000 (kill first). Set by processes themselves or by systemd OOMScoreAdjust= in unit files. Docker sets containers\' oom_score_adj to protect the host. Protect critical processes: echo -1000 > /proc/<pid>/oom_score_adj.',
         perms:'-r--r--r--  root root (oom_score) / -rw-r--r-- (oom_score_adj)',
         files:['oom_score','oom_score_adj'],
         tip:'<code>grep -r "" /proc/*/oom_score_adj 2>/dev/null | sort -t: -k2 -n | head -20</code> shows processes most protected from OOM.'},
      ]},
     {id:'proc-net-dir',name:'/proc/net',cat:'device',label:'net/',
      type:'network subsystem statistics',
      role:'Live network protocol statistics, routing table, ARP table, and socket inventory.',
      desc:'Virtual directory (actually a symlink to /proc/self/net/). Key files: tcp/tcp6/udp/udp6 (socket table with state, addresses, UIDs), arp (ARP cache), route (routing table), dev (per-interface RX/TX counters, errors, drops), nf_conntrack (netfilter connection tracking if loaded), wireless (WiFi interface stats), snmp (SNMP MIB counters).',
      perms:'dr-xr-xr-x  root root',
      files:['tcp','tcp6','udp','udp6','unix','arp','route','dev','dev_mcast','dev_snmp6','if_inet6','ipv6_route','nf_conntrack','netstat','snmp','sockstat','protocols','wireless','fib_trie','fib_triestat','rt_cache'],
      tip:'<code>ss -tulpn</code> is the modern human-friendly version. <code>cat /proc/net/nf_conntrack | wc -l</code> counts tracked connections.',
      children:[
        {id:'proc-net-tcp',name:'tcp/udp',cat:'device',label:'tcp/udp',
         type:'socket state table',
         role:'Raw kernel socket table: all TCP and UDP sockets with local/remote addresses and state.',
         desc:'Columns: sl (slot), local_address (hex IP:port), rem_address, st (state: 01=ESTABLISHED, 0A=LISTEN, 06=TIME_WAIT...), tx_queue:rx_queue (bytes in kernel buffers), uid (owning UID), inode (socket inode). ss and netstat parse these files. nf_conntrack shows NAT connection tracking state.',
         perms:'-r--r--r--  root root',
         files:['tcp','tcp6','udp','udp6'],
         tip:'<code>awk \'/[0-9A-F]{8}:0016 / {print $2}\' /proc/net/tcp</code> finds port 22 (SSH) listeners.'},
        {id:'proc-net-conntrack',name:'nf_conntrack',cat:'device',label:'nf_conntrack',
         type:'netfilter connection tracker',
         role:'Netfilter connection tracking table: all tracked network connections with NAT state.',
         desc:'One line per tracked connection. Fields: protocol, timeout, state (ESTABLISHED/SYN_SENT/etc.), source/destination IP and port for original and reply directions, NAT transformation (if applicable), [ASSURED] (bidirectional traffic seen). Used by iptables NAT, Docker networking, and firewall stateful inspection. Maximum tracked connections: /proc/sys/net/netfilter/nf_conntrack_max.',
         perms:'-r--r--r--  root root',
         files:[],
         tip:'<code>cat /proc/net/nf_conntrack | wc -l</code> counts tracked connections. <code>conntrack -L</code> is the human-friendly command.'},
      ]},
     {id:'proc-sys-dir',name:'/proc/sys',cat:'device',label:'sys/',
      type:'kernel runtime tunables (writable)',
      role:'Writable kernel parameters. Writing to these files changes kernel behavior immediately without rebooting.',
      desc:'Hierarchical — path components map to sysctl key: /proc/sys/net/ipv4/ip_forward = net.ipv4.ip_forward. Read with cat, write with echo (root) or sysctl. /etc/sysctl.conf makes changes persistent. Categories: kernel/ (general + security), net/ (networking), vm/ (virtual memory), fs/ (filesystems).',
      perms:'dr-xr-xr-x  root root  (some files writable by root)',
      files:['kernel/','kernel/hostname','kernel/dmesg_restrict','kernel/kptr_restrict','kernel/randomize_va_space','kernel/panic','kernel/sysrq','kernel/pid_max','kernel/core_pattern','kernel/yama/','kernel/yama/ptrace_scope','net/','net/ipv4/','net/ipv4/ip_forward','net/ipv4/tcp_syncookies','vm/','vm/swappiness','vm/overcommit_memory','vm/drop_caches','fs/','fs/file-max','fs/inotify/'],
      tip:'<code>sysctl -a 2>/dev/null | grep randomize_va_space</code> checks ASLR setting.',
      children:[
        {id:'proc-sys-kernel',name:'kernel/',cat:'device',label:'kernel/',
         type:'kernel security & behavior params',
         role:'Core kernel behavior and security parameters.',
         desc:'dmesg_restrict=1: only root reads kernel log (prevents info leaks). kptr_restrict=2: hide kernel pointer addresses (defeats KASLR bypass). randomize_va_space=2: full ASLR. yama/ptrace_scope=1: only parent can ptrace child (prevents injection). perf_event_paranoid=3: no unprivileged hardware counters. unprivileged_bpf_disabled=1: root-only BPF. core_pattern: defines where/how core dumps are written. pid_max: maximum PID value.',
         perms:'dr-xr-xr-x  root root',
         files:['hostname','dmesg_restrict','kptr_restrict','randomize_va_space','panic','panic_on_oops','sysrq','pid_max','core_pattern','core_uses_pid','yama/ptrace_scope','perf_event_paranoid','unprivileged_bpf_disabled','unprivileged_userns_clone','modules_disabled','ngroups_max','msgmax'],
         tip:'<code>sysctl kernel.kptr_restrict kernel.randomize_va_space kernel.yama.ptrace_scope</code> checks key security settings.'},
        {id:'proc-sys-net',name:'net/',cat:'device',label:'net/',
         type:'network stack tunables',
         role:'Network performance and security kernel parameters.',
         desc:'ipv4/tcp_syncookies=1: SYN flood defense (required). ipv4/ip_forward=0: routing/NAT disabled by default. ipv4/conf/all/rp_filter=1: strict reverse path filtering (anti-spoofing). ipv4/conf/all/log_martians=1: log impossible source addresses. core/somaxconn: max backlog for listen(). net/netfilter/nf_conntrack_max: connection tracking table size.',
         perms:'dr-xr-xr-x  root root',
         files:['ipv4/ip_forward','ipv4/tcp_syncookies','ipv4/tcp_fin_timeout','ipv4/tcp_keepalive_time','ipv4/conf/all/rp_filter','ipv4/conf/all/log_martians','ipv4/conf/all/accept_redirects','ipv4/conf/all/send_redirects','core/somaxconn','core/rmem_max','core/wmem_max','core/netdev_max_backlog','ipv6/conf/all/disable_ipv6'],
         tip:'<code>sysctl -a | grep "tcp_syncookies\|rp_filter\|log_martians"</code> checks key network security settings.'},
        {id:'proc-sys-vm',name:'vm/',cat:'device',label:'vm/',
         type:'virtual memory manager tunables',
         role:'Memory management kernel parameters: swap preference, dirty page policy, overcommit.',
         desc:'swappiness (0–200): how aggressively to use swap (default 60; 10 for desktops; 1 for databases). overcommit_memory: 0=heuristic, 1=always allow, 2=strict (refuse over-allocation). dirty_ratio: % of RAM dirty before writes block. drop_caches: write 1(page), 2(dentries/inodes), 3(all) to reclaim cache. mmap_min_addr: NULL pointer exploit mitigation.',
         perms:'dr-xr-xr-x  root root',
         files:['swappiness','dirty_ratio','dirty_background_ratio','overcommit_memory','overcommit_ratio','drop_caches','mmap_min_addr','min_free_kbytes','vfs_cache_pressure','nr_hugepages'],
         tip:'<code>echo 3 > /proc/sys/vm/drop_caches</code> drops all page cache (safe on live system). <code>sysctl vm.swappiness</code> checks swap preference.'},
      ]},
     {id:'proc-kallsyms',name:'/proc/kallsyms',cat:'device',label:'kallsyms',
      type:'kernel symbol table',
      role:'All kernel function and variable symbols with their virtual addresses.',
      desc:'One line per symbol: address type name [module]. With kptr_restrict=2 (recommended), non-root users see all-zero addresses — preventing KASLR bypass. Root sees real addresses. Used by: klogd (resolving addresses in kernel messages), crash analysis tools, rootkit detection (check for missing/modified symbols). Same as /boot/System.map but live.',
      perms:'-r--r--r--  root root',
      files:[],
      tip:'<code>grep " T tcp_connect$" /proc/kallsyms</code> finds a specific kernel function address (root only with kptr_restrict=0).'},
     {id:'proc-interrupts',name:'/proc/interrupts',cat:'device',label:'interrupts',
      type:'IRQ statistics table',
      role:'Per-CPU hardware interrupt counter table since boot. Shows IRQ distribution across CPUs.',
      desc:'Rows: IRQ number or named IRQ. Columns: count per CPU, plus IRQ type (IO-APIC, MSI, etc.) and device name. High IRQ counts on one CPU (typically CPU0) indicates IRQ imbalance — configure irqbalance or set IRQ affinity. "LOC" = local timer interrupt (scheduler tick), "TLB" = TLB shootdown.',
      perms:'-r--r--r--  root root',
      files:[],
      tip:'<code>watch -d cat /proc/interrupts</code> highlights changing interrupt counts. <code>cat /proc/irq/<N>/smp_affinity</code> shows IRQ CPU affinity.'},
   ]},

  //───────────── /sys ─────────────
  {id:'sys',name:'/sys',cat:'device',label:'/sys',badge:'sysfs (virtual)',
   type:'kernel object model (sysfs)',
   role:'sysfs — the kernel device model and hardware topology exposed as a navigable filesystem.',
   desc:'Introduced in Linux 2.6 to replace /proc for device info. Provides structured view of all kernel objects: devices, buses, drivers, classes, power management. Used by udev to populate /dev and manage hotplug. Everything is a kobject with attributes as files.',
   perms:'dr-xr-xr-x  root root  (sysfs)',
   files:['block/','bus/','class/','devices/','firmware/','fs/','kernel/','module/','power/'],
   tip:'<code>cat /sys/class/power_supply/BAT0/capacity</code> shows battery %. <code>udevadm info -a -n /dev/sda</code> walks sysfs for a device.',
   children:[
     {id:'sys-class',name:'/sys/class',cat:'device',label:'class/',
      type:'device class directory',
      role:'Devices organised by class/type: net, block, input, backlight, power_supply, leds, etc.',
      desc:'Each subdirectory is a class of devices with symlinks to the actual device in /sys/devices/. Read/write attribute files to inspect and control hardware without ioctl. Many values are writable by root (or members of specific groups) for live hardware control.',
      perms:'dr-xr-xr-x  root root',
      files:['net/','block/','input/','tty/','usb_device/','power_supply/','backlight/','leds/','thermal/','hwmon/','rtc/','drm/','nvme/','scsi_device/','scsi_disk/','scsi_host/','sound/','video4linux/','mem/'],
      tip:'<code>ls /sys/class/</code> lists all device classes. <code>cat /sys/class/net/eth0/speed</code> shows NIC link speed.',
      children:[
        {id:'sys-class-net',name:'/sys/class/net',cat:'device',label:'net/',
         type:'network interface sysfs',
         role:'sysfs entries for every network interface: Ethernet, WiFi, loopback, bridges, VLANs, VPNs.',
         desc:'Each directory is an interface. Attribute files: address (MAC), mtu, speed, duplex, operstate (up/down/unknown), carrier (link detected), tx_queue_len, statistics/ (rx_bytes, rx_errors, tx_bytes, tx_dropped, etc.), queues/ (tx queue config). Symlink to bus device for hardware interfaces.',
         perms:'dr-xr-xr-x  root root',
         files:['lo/','eth0/','ens3/','ens160/','wlan0/','docker0/','virbr0/','tun0/','flannel.1/','cni0/'],
         tip:'<code>cat /sys/class/net/eth0/statistics/rx_bytes</code> shows bytes received. <code>cat /sys/class/net/eth0/operstate</code> shows up/down status.'},
        {id:'sys-class-block',name:'/sys/class/block',cat:'device',label:'block/',
         type:'block device sysfs',
         role:'sysfs entries for every block device: disks, partitions, loop devices, DM targets.',
         desc:'Attribute files: size (in 512-byte sectors), ro (read-only flag), stat (I/O stats: reads/writes/sectors/ticks/in_flight), queue/ (I/O scheduler settings — scheduler, nr_requests, rotational, optimal_io_size). Parent device info via device/ symlink. Rotational=0 for SSDs.',
         perms:'dr-xr-xr-x  root root',
         files:['sda/','sda1/','nvme0n1/','nvme0n1p1/','loop0/','dm-0/','dm-1/'],
         tip:'<code>cat /sys/class/block/sda/queue/rotational</code> — 0 = SSD, 1 = HDD. <code>cat /sys/class/block/sda/size</code> gives size in 512-byte sectors.'},
        {id:'sys-class-power',name:'/sys/class/power_supply',cat:'device',label:'power_supply/',
         type:'battery & power supply sysfs',
         role:'Battery and AC adapter real-time status: charge level, voltage, current, health, cycle count.',
         desc:'BAT0/ (or BAT1, etc.): capacity (0–100%), status (Charging/Discharging/Full/Unknown), energy_now, energy_full, energy_full_design, voltage_now, current_now, charge_cycles, manufacturer, model_name, serial_number, technology (Li-ion/NiMH), health (Good/Dead/Overvoltage). AC0/: online (1=on AC, 0=on battery).',

// ─── Layout constants ───────────────────────────────────────────────────
const NW=90,NH=28,HG=10,VG=58,PAD=20;
const expanded=new Set(['root']);
let selectedId=null;
let tx=40,ty=40,scale=1;
let dragging=false,dragStartX=0,dragStartY=0,dragStartTx=0,dragStartTy=0;
let panelVisible=true;

function getVis(n){return(expanded.has(n.id)&&n.children)?n.children:[];}

let leafX=0;
function computeLayout(n,depth){
  n._d=depth;
  const ch=getVis(n);
  if(!ch.length){n._cx=PAD+leafX*(NW+HG)+NW/2;leafX++;return;}
  ch.forEach(c=>computeLayout(c,depth+1));
  n._cx=(ch[0]._cx+ch[ch.length-1]._cx)/2;
}
function maxDepth(n){const ch=getVis(n);if(!ch.length)return n._d;return Math.max(...ch.map(maxDepth));}
function layout(){leafX=0;computeLayout(TREE,0);}
function allNodes(n,a=[]){a.push(n);(n.children||[]).forEach(c=>allNodes(c,a));return a;}

// ─── Render ──────────────────────────────────────────────────────────────
const NS='http://www.w3.org/2000/svg';
const svgEl=document.getElementById('tree-svg');
const treeG=document.getElementById('tree-g');
const canvas=document.getElementById('canvas');

function mkEl(tag,attrs){
  const e=document.createElementNS(NS,tag);
  Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
  return e;
}

function applyTransform(){
  treeG.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);
  document.getElementById('zoom-label').textContent=Math.round(scale*100)+'%';
}

function render(){
  layout();
  treeG.innerHTML='';
  const edgeG=mkEl('g',{});
  const nodeG=mkEl('g',{});
  treeG.appendChild(edgeG);
  treeG.appendChild(nodeG);

  function drawTree(n){
    const c=CAT[n.cat];
    const nx=n._cx-NW/2;
    const ny=PAD+n._d*(NH+VG);
    const isSel=n.id===selectedId;
    const hasKids=!!(n.children&&n.children.length);
    const isExp=hasKids&&expanded.has(n.id);

    const g=document.createElementNS(NS,'g');
    g.style.cursor='pointer';

    if(isSel){
      const glow=mkEl('rect',{x:nx-2,y:ny-2,width:NW+4,height:NH+4,rx:8,fill:'#ffffff14'});
      g.appendChild(glow);
    }

    const rect=mkEl('rect',{x:nx,y:ny,width:NW,height:NH,rx:5,
      fill:c.fill,stroke:isSel?'#ffffffcc':c.stroke,'stroke-width':isSel?1.5:0.75});
    g.appendChild(rect);

    let lbl=n.label||n.name;
    if(lbl.length>11)lbl=lbl.slice(0,10)+'\u2026';

    const txt=mkEl('text',{x:n._cx-(hasKids?7:0),y:ny+NH/2,
      'text-anchor':'middle','dominant-baseline':'central',fill:c.text,
      'font-family':"'JetBrains Mono', monospace",'font-size':'11',
      'font-weight':isSel?'600':'400'});
    txt.textContent=lbl;
    g.appendChild(txt);

    if(hasKids){
      const ic=mkEl('circle',{cx:nx+NW-9,cy:ny+NH/2,r:5,
        fill:isExp?c.stroke:'transparent',stroke:c.stroke,'stroke-width':'1'});
      g.appendChild(ic);
      const is=mkEl('text',{x:nx+NW-9,y:ny+NH/2,
        'text-anchor':'middle','dominant-baseline':'central',
        fill:isExp?c.fill:c.stroke,'font-size':'9','font-family':'monospace','font-weight':'700'});
      is.textContent=isExp?'\u2212':'+';
      g.appendChild(is);
    }

    g.addEventListener('click',e=>{
      e.stopPropagation();
      selectedId=n.id;
      if(hasKids){if(expanded.has(n.id))expanded.delete(n.id);else expanded.add(n.id);}
      showDetail(n);
      render();
    });

    nodeG.appendChild(g);

    const ch=getVis(n);
    ch.forEach(child=>{
      const x1=n._cx,y1=ny+NH;
      const cy2=PAD+child._d*(NH+VG),x2=child._cx;
      const my=(y1+cy2)/2;
      const path=mkEl('path',{d:`M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${cy2}`,
        fill:'none',stroke:CAT[child.cat].stroke,'stroke-width':'0.8',opacity:'0.4'});
      edgeG.appendChild(path);
      drawTree(child);
    });
  }

  drawTree(TREE);
  const md=maxDepth(TREE);
  const svgW=PAD*2+leafX*(NW+HG);
  const svgH=PAD*2+(md+1)*(NH+VG);
  svgEl.setAttribute('width',svgW);
  svgEl.setAttribute('height',svgH);
  applyTransform();
}

// ─── Detail panel ─────────────────────────────────────────────────────────
function findPath(target,node,path=[]){
  path.push(node);
  if(node.id===target.id)return path;
  for(const ch of(node.children||[])){
    const f=findPath(target,ch,[...path]);
    if(f)return f;
  }
  return null;
}

function showDetail(n){
  const panel=document.getElementById('detail');
  const c=CAT[n.cat];
  const pills=(n.files||[]).map(f=>`<span class="f-pill">${f}</span>`).join('');
  const pathNodes=findPath(n,TREE);
  const crumb=pathNodes?pathNodes.map(x=>x.label||x.name).join(' / '):'';

  let html=`<div class="detail-inner">`;
  if(crumb)html+=`<div class="d-crumb">${crumb}</div>`;
  html+=`<div class="d-path">${n.name}</div>`;
  html+=`<span class="d-badge" style="background:${c.bb};color:${c.bt};border:1px solid ${c.bbd}">${n.type}</span>`;
  if(n.badge)html+=`<span class="d-badge" style="background:#191e24;color:#8b949e;border:1px solid #444c56">${n.badge}</span>`;
  html+=`<div class="d-role">${n.role}</div>`;
  html+=`<div class="d-desc">${n.desc}</div>`;
  if(n.perms)html+=`<div class="d-perms"><div style="font-size:9px;color:var(--text3)">permissions</div><code>${n.perms}</code></div>`;
  if(pills)html+=`<div class="d-label">common contents</div><div class="d-files">${pills}</div>`;
  if(n.warn)html+=`<div class="d-warn"><strong>&#9888; security note &nbsp;</strong>${n.warn}</div>`;
  if(n.tip)html+=`<div class="d-tip"><strong>tip &nbsp;</strong>${n.tip}</div>`;
  if(n.children)html+=`<div class="expand-hint">${expanded.has(n.id)?'&#9650; click node to collapse':'&#9660; click node to expand children'}</div>`;
  html+=`</div>`;
  panel.innerHTML=html;
}

// ─── Pan/Zoom ─────────────────────────────────────────────────────────────
canvas.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  dragging=true;dragStartX=e.clientX;dragStartY=e.clientY;
  dragStartTx=tx;dragStartTy=ty;canvas.classList.add('panning');
});
window.addEventListener('mousemove',e=>{
  if(!dragging)return;
  tx=dragStartTx+(e.clientX-dragStartX);ty=dragStartTy+(e.clientY-dragStartY);
  applyTransform();
});
window.addEventListener('mouseup',()=>{dragging=false;canvas.classList.remove('panning');});

canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const delta=e.deltaY>0?0.9:1.1;
  const ns=Math.max(0.08,Math.min(5,scale*delta));
  tx=mx-(mx-tx)*(ns/scale);ty=my-(my-ty)*(ns/scale);
  scale=ns;applyTransform();
},{passive:false});

canvas.addEventListener('dblclick',()=>resetView());

let lastTouchDist=0;
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1){dragging=true;dragStartX=e.touches[0].clientX;dragStartY=e.touches[0].clientY;dragStartTx=tx;dragStartTy=ty;}
  else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;lastTouchDist=Math.sqrt(dx*dx+dy*dy);}
  e.preventDefault();
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&dragging){tx=dragStartTx+(e.touches[0].clientX-dragStartX);ty=dragStartTy+(e.touches[0].clientY-dragStartY);applyTransform();}
  else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;const dist=Math.sqrt(dx*dx+dy*dy);scale=Math.max(0.08,Math.min(5,scale*(dist/lastTouchDist)));lastTouchDist=dist;applyTransform();}
  e.preventDefault();
},{passive:false});
canvas.addEventListener('touchend',()=>{dragging=false;});

function zoomIn(){scale=Math.min(5,scale*1.2);applyTransform();}
function zoomOut(){scale=Math.max(0.08,scale/1.2);applyTransform();}

function zoomFit(){
  layout();
  const md=maxDepth(TREE);
  const cW=PAD*2+leafX*(NW+HG);
  const cH=PAD*2+(md+1)*(NH+VG);
  const aw=canvas.clientWidth,ah=canvas.clientHeight;
  scale=Math.min(aw/cW,ah/cH)*0.95;
  tx=(aw-cW*scale)/2;ty=(ah-cH*scale)/2;
  applyTransform();
}

// ─── Controls ─────────────────────────────────────────────────────────────
function expandAll(){allNodes(TREE).forEach(n=>{if(n.children)expanded.add(n.id);});render();}
function collapseAll(){expanded.clear();expanded.add('root');render();}
function resetView(){
  expanded.clear();expanded.add('root');selectedId=null;
  document.getElementById('detail').innerHTML='<div class="detail-inner"><div class="ph"><span class="ph-icon">&#8984;</span>click any node<br>to inspect</div></div>';
  render();tx=40;ty=40;scale=1;applyTransform();
  setTimeout(zoomFit,50);
}
function togglePanel(){
  panelVisible=!panelVisible;
  const p=document.getElementById('detail'),btn=document.getElementById('panel-btn');
  if(panelVisible){p.classList.remove('hidden');btn.classList.add('active');btn.textContent='\u25B6 panel';}
  else{p.classList.add('hidden');btn.classList.remove('active');btn.textContent='\u25C0 panel';}
}

// ─── Init ─────────────────────────────────────────────────────────────────
svgEl.style.width='200000px';svgEl.style.height='200000px';
render();
setTimeout(zoomFit,50);
</script>
