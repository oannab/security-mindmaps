<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linux Filesystem Hierarchy — Map</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap');
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--bg4:#21262d;
  --border:#30363d;--border2:#444c56;
  --text:#e6edf3;--text2:#8b949e;--text3:#6e7681;
  --mono:'JetBrains Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);}
header{
  height:50px;border-bottom:1px solid var(--border);
  padding:0 16px;display:flex;align-items:center;gap:10px;
  background:var(--bg2);position:relative;z-index:10;flex-shrink:0;
}
header h1{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.02em;white-space:nowrap;}
.sub{font-size:10px;color:var(--text3);font-family:var(--mono);white-space:nowrap;}
.legend{display:flex;gap:9px;flex-wrap:nowrap;align-items:center;margin-left:6px;}
.leg{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--text3);font-family:var(--mono);white-space:nowrap;}
.legdot{width:7px;height:7px;border-radius:2px;flex-shrink:0;}
.hdr-right{margin-left:auto;display:flex;gap:5px;align-items:center;}
.btn{font-family:var(--mono);font-size:11px;padding:3px 8px;background:transparent;border:1px solid var(--border2);border-radius:4px;color:var(--text2);cursor:pointer;transition:all .12s;white-space:nowrap;}
.btn:hover{background:var(--bg3);color:var(--text);}
.btn.active{background:var(--bg3);border-color:var(--text2);color:var(--text);}
.main{display:flex;height:calc(100vh - 50px);}
.canvas{flex:1;overflow:hidden;position:relative;cursor:grab;}
.canvas.panning{cursor:grabbing;}
#tree-svg{display:block;position:absolute;top:0;left:0;}
.zoom-controls{position:absolute;bottom:16px;left:16px;display:flex;flex-direction:column;gap:4px;z-index:5;}
.zbtn{width:28px;height:28px;background:var(--bg2);border:1px solid var(--border2);border-radius:4px;color:var(--text2);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--mono);transition:all .12s;}
.zbtn:hover{background:var(--bg3);color:var(--text);}
.zoom-label{font-size:10px;font-family:var(--mono);color:var(--text3);text-align:center;}
.hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:10px;font-family:var(--mono);color:var(--text3);background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:3px 8px;pointer-events:none;opacity:.6;white-space:nowrap;}
.detail{width:360px;flex-shrink:0;overflow-y:auto;background:var(--bg2);border-left:1px solid var(--border);transition:width .2s ease,opacity .2s ease;}
.detail.hidden{width:0;opacity:0;overflow:hidden;border-left:none;}
.detail-inner{padding:18px;min-width:320px;}
.ph{color:var(--text3);font-family:var(--mono);font-size:12px;text-align:center;margin-top:60px;line-height:2;}
.ph-icon{font-size:22px;opacity:.2;display:block;margin-bottom:8px;}
.d-path{font-family:var(--mono);font-size:15px;font-weight:600;margin-bottom:5px;word-break:break-all;}
.d-crumb{font-size:10px;font-family:var(--mono);color:var(--text3);margin-bottom:4px;word-break:break-all;}
.d-badge{display:inline-block;font-size:10px;font-family:var(--mono);padding:2px 6px;border-radius:3px;margin-bottom:8px;margin-right:3px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;}
.d-role{font-size:12.5px;color:var(--text2);margin-bottom:8px;line-height:1.65;}
.d-desc{font-size:11.5px;color:var(--text3);line-height:1.65;margin-bottom:10px;border-left:2px solid var(--border);padding-left:9px;}
.d-label{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);font-family:var(--mono);margin-bottom:5px;font-weight:500;}
.d-perms{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:7px 10px;margin-bottom:10px;}
.d-perms code{font-family:var(--mono);font-size:10.5px;color:#e3b341;display:block;margin-top:2px;}
.d-files{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;}
.f-pill{font-family:var(--mono);font-size:10px;padding:2px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;color:var(--text2);}
.d-tip{background:var(--bg3);border:1px solid #2d2060;border-radius:4px;padding:8px 10px;font-size:11px;color:var(--text3);margin-top:8px;line-height:1.65;}
.d-tip strong{color:#7c6af7;font-family:var(--mono);font-size:10px;}
.d-tip code{font-family:var(--mono);font-size:10px;color:var(--text2);background:var(--bg4);padding:1px 3px;border-radius:3px;}
.expand-hint{font-size:9px;font-family:var(--mono);color:var(--text3);text-align:center;margin-top:10px;letter-spacing:.05em;}
.d-warn{background:#2d1210;border:1px solid #6b2d26;border-radius:4px;padding:7px 10px;font-size:11px;color:#F5C4B3;margin-top:8px;}
.d-warn strong{color:#f78166;font-family:var(--mono);font-size:10px;}
</style>
</head>
<body>
<header>
  <div>
    <h1>/ Linux Filesystem Hierarchy — Map</h1>
    <div class="sub">FHS 3.0 + arch internals · scroll=zoom · drag=pan · click=expand/inspect</div>
  </div>
  <div class="legend">
    <div class="leg"><div class="legdot" style="background:#534AB7"></div>system/kernel</div>
    <div class="leg"><div class="legdot" style="background:#0F6E56"></div>variable data</div>
    <div class="leg"><div class="legdot" style="background:#854F0B"></div>config</div>
    <div class="leg"><div class="legdot" style="background:#185FA5"></div>user</div>
    <div class="leg"><div class="legdot" style="background:#993C1D"></div>devices/virtual</div>
    <div class="leg"><div class="legdot" style="background:#5F5E5A"></div>misc/runtime</div>
  </div>
  <div class="hdr-right">
    <button class="btn" onclick="expandAll()">expand all</button>
    <button class="btn" onclick="collapseAll()">collapse all</button>
    <button class="btn" onclick="resetView()">reset</button>
    <button class="btn active" id="panel-btn" onclick="togglePanel()">&#9654; panel</button>
  </div>
</header>
<div class="main">
  <div class="canvas" id="canvas">
    <svg id="tree-svg" xmlns="http://www.w3.org/2000/svg"><g id="tree-g"></g></svg>
    <div class="zoom-controls">
      <div class="zbtn" onclick="zoomIn()">+</div>
      <div class="zoom-label" id="zoom-label">100%</div>
      <div class="zbtn" onclick="zoomOut()">&minus;</div>
      <div class="zbtn" onclick="zoomFit()" title="fit to screen" style="font-size:11px;">&#9974;</div>
    </div>
    <div class="hint">scroll=zoom &nbsp;·&nbsp; drag=pan &nbsp;·&nbsp; dbl-click=reset</div>
  </div>
  <div class="detail" id="detail">
    <div class="detail-inner">
      <div class="ph"><span class="ph-icon">&#8984;</span>click any node<br>to inspect</div>
    </div>
  </div>
</div>
<script>
const CAT={
  kernel:{fill:'#1a1535',stroke:'#534AB7',text:'#CECBF6',bb:'#1a1535',bt:'#7c6af7',bbd:'#3d3070'},
  var:   {fill:'#0d2116',stroke:'#0F6E56',text:'#9FE1CB',bb:'#0d2116',bt:'#3fb950',bbd:'#1e4d2b'},
  config:{fill:'#271d08',stroke:'#854F0B',text:'#FAC775',bb:'#271d08',bt:'#e3b341',bbd:'#5a4312'},
  user:  {fill:'#0c1e33',stroke:'#185FA5',text:'#B5D4F4',bb:'#0c1e33',bt:'#58a6ff',bbd:'#1a3d66'},
  device:{fill:'#2d1210',stroke:'#993C1D',text:'#F5C4B3',bb:'#2d1210',bt:'#f78166',bbd:'#6b2d26'},
  misc:  {fill:'#191e24',stroke:'#444c56',text:'#8b949e',bb:'#191e24',bt:'#79c0ff',bbd:'#2d3a47'},
};

const TREE={
  id:'root',name:'/',cat:'kernel',label:'/',
  type:'root filesystem',
  role:'Root of the entire filesystem hierarchy. Every file, device, and directory on the system lives beneath this point.',
  desc:'The kernel mounts the root filesystem first during boot. The Filesystem Hierarchy Standard (FHS 3.0) defines what goes where. On modern distros /bin, /sbin, /lib are symlinks into /usr.',
  perms:'drwxr-xr-x  root root',
  files:['bin/','sbin/','usr/','lib/','lib64/','boot/','etc/','var/','home/','root/','dev/','proc/','sys/','tmp/','run/','mnt/','media/','opt/','srv/'],
  tip:'<code>ls -la /</code> reveals symlinks to /usr. <code>df -h /</code> shows root filesystem usage.',
  children:[
  //───────────── /bin ─────────────
  {id:'bin',name:'/bin',cat:'kernel',label:'/bin',badge:'→ /usr/bin',
   type:'essential user binaries',
   role:'Essential user-space binaries needed before /usr is mounted. Core commands available to all users.',
   desc:'On modern Ubuntu/Debian/Fedora/Arch, /bin is a symlink to /usr/bin. Historically a separate directory so the system could boot even with /usr on a separate partition.',
   perms:'lrwxrwxrwx  root root → usr/bin',
   files:['ls','cp','mv','rm','cat','echo','bash','sh','chmod','chown','ln','mkdir','rmdir','grep','find','ps','kill','mount','dd','df','du','date','pwd','touch','sort','head','tail','cut','awk','sed','xargs','tr','tee','wc','true','false','sleep'],
   tip:'<code>which ls</code> resolves to /usr/bin/ls via the symlink. <code>file /bin</code> confirms it is a symlink.'},

  //───────────── /sbin ─────────────
  {id:'sbin',name:'/sbin',cat:'kernel',label:'/sbin',badge:'→ /usr/sbin',
   type:'system admin binaries',
   role:'System administration binaries. Typically only run by root or via sudo.',
   desc:'Also symlinked to /usr/sbin on modern distros. Contains commands for booting, mounting filesystems, managing network interfaces, and system recovery.',
   perms:'lrwxrwxrwx  root root → usr/sbin',
   files:['init','systemd','ifconfig','ip','iptables','nftables','ip6tables','fdisk','fsck','mkfs','mkfs.ext4','mkfs.xfs','shutdown','reboot','halt','useradd','userdel','usermod','groupadd','modprobe','lsmod','rmmod','depmod','blkid','lsblk','sshd','logrotate','fail2ban','route','arp','ethtool','swapon','swapoff','losetup'],
   tip:'<code>sudo fdisk -l</code> lists partition tables. <code>lsblk -f</code> shows all block devices with filesystems.'},

  //───────────── /usr ─────────────
  {id:'usr',name:'/usr',cat:'kernel',label:'/usr',
   type:'unix system resources',
   role:'The largest directory. Contains the majority of user utilities, applications, libraries, and documentation.',
   desc:'Traditionally shareable and read-only — can be NFS-mounted. The equivalent of "Program Files" but for system-wide software. Subdivided into bin, sbin, lib, share, include, local.',
   perms:'drwxr-xr-x  root root',
   files:['bin/','sbin/','lib/','lib64/','local/','share/','include/','src/','games/'],
   tip:'<code>du -sh /usr/*</code> shows which subsystem uses the most space.',
   children:[
     {id:'usr-bin',name:'/usr/bin',cat:'kernel',label:'bin',
      type:'user binaries',
      role:'Non-essential (for boot) user commands installed by packages. Primary location for user executables.',
      desc:'Everything installed via apt/dnf/pacman lands binaries here. On modern systems /bin → /usr/bin.',
      perms:'drwxr-xr-x  root root',
      files:['python3','python3.12','git','vim','nano','curl','wget','ssh','scp','sftp','rsync','gcc','g++','make','cmake','gdb','strace','ltrace','apt','dpkg','snap','flatpak','zip','tar','gzip','bzip2','xz','unzip','man','diff','patch','awk','sed','perl','ruby','node','npm','jq','htop','top','tmux','screen','openssl','gpg','gpg2','nc','ncat','nmap','tcpdump','wireshark','tshark','ffmpeg','convert','ffprobe','docker','kubectl','ansible','terraform'],
      tip:'<code>ls /usr/bin | wc -l</code> — a typical system has 1000–3000 binaries here.'},
     {id:'usr-sbin',name:'/usr/sbin',cat:'kernel',label:'sbin',
      type:'admin binaries',
      role:'Non-essential system administration binaries not required at boot.',
      desc:'Package-installed admin tools. Web server daemons (nginx, apache2), mail servers, DNS, and DHCP servers live here.',
      perms:'drwxr-xr-x  root root',
      files:['apache2','nginx','sshd','cron','rsyslogd','syslogd','named','dhcpd','ntpd','chronyd','postfix','sendmail','exim4','dovecot','adduser','deluser','visudo','chroot','update-grub','grub-install','useradd','userdel','usermod','logrotate','fail2ban-server','fail2ban-client','ufw','iptables-save','iptables-restore','ss','arp','tcpdump','netstat','nstat','brctl'],
      tip:'<code>which nginx</code> shows it resolves to /usr/sbin/nginx.'},
     {id:'usr-lib',name:'/usr/lib',cat:'kernel',label:'lib',
      type:'shared libraries',
      role:'Shared libraries (.so files) and internal program data. Not for direct user invocation.',
      desc:'The dynamic linker searches paths from /etc/ld.so.conf. Contains .so files loaded at runtime, Python modules, systemd units, firmware, and udev rules.',
      perms:'drwxr-xr-x  root root',
      files:['x86_64-linux-gnu/','aarch64-linux-gnu/','python3/','python3.12/','systemd/','modules/','firmware/','locale/','fonts/','udev/','debug/','libc.so.6','libm.so.6','libpthread.so.0','libssl.so.3','libcrypto.so.3','libdl.so.2','librt.so.1','libcrypt.so.1','libresolv.so.2','libnss_dns.so','libnss_files.so','libpam.so.0'],
      tip:'<code>ldd /usr/bin/bash</code> shows which .so files bash links against. <code>ldconfig -p | grep libssl</code> finds SSL library.',
      children:[
        {id:'usr-lib-x86',name:'/usr/lib/x86_64-linux-gnu',cat:'kernel',label:'x86_64-gnu/',
         type:'arch-specific libraries',
         role:'Architecture-specific shared libraries for the system\'s native ABI (x86-64 on amd64 systems).',
         desc:'On multiarch Debian/Ubuntu systems, architecture-tagged library dirs coexist. This allows 32-bit (i386) and 64-bit (amd64) libs on the same system. Contains libc.so.6, libssl.so, libcrypto.so, and all major system libraries.',
         perms:'drwxr-xr-x  root root',
         files:['libc.so.6','libm.so.6','libpthread.so.0','libssl.so.3','libcrypto.so.3','libz.so.1','libpcre.so.3','libpcre2-8.so.0','liblzma.so.5','libudev.so.1','libsystemd.so.0','libpam.so.0','libaudit.so.1','libcap.so.2','libseccomp.so.2','libselinux.so.1','libapparmor.so.1'],
         tip:'<code>ls /usr/lib/x86_64-linux-gnu/libssl*</code> shows all SSL library versions installed.'},
        {id:'usr-lib-python',name:'/usr/lib/python3',cat:'kernel',label:'python3/',
         type:'Python standard library',
         role:'Python standard library modules installed system-wide.',
         desc:'Contains all stdlib modules (os, sys, json, http, etc.) for the system Python. dist-packages/ holds packages installed by apt; site-packages/ for manually installed packages.',
         perms:'drwxr-xr-x  root root',
         files:['python3.12/','python3.12/lib-dynload/','python3.12/dist-packages/','python3.12/site-packages/','python3/dist-packages/'],
         tip:'<code>python3 -c "import sys; print(sys.path)"</code> shows all Python search paths.'},
        {id:'usr-lib-systemd',name:'/usr/lib/systemd',cat:'kernel',label:'systemd/',
         type:'vendor systemd unit files',
         role:'System-provided (vendor) unit files for all installed packages. Do not edit these directly.',
         desc:'These are the defaults shipped by packages. To override, create drop-ins in /etc/systemd/system/<unit>.d/ — those survive package upgrades. Contains service, socket, timer, mount, target, path, and device units.',
         perms:'drwxr-xr-x  root root',
         files:['system/','system/nginx.service','system/ssh.service','system/sshd.service','system/cron.service','system/docker.service','system/NetworkManager.service','system/systemd-journald.service','system/systemd-logind.service','system/auditd.service','system/rsyslog.service','user/','system-preset/','systemd','systemd-journald','systemd-udevd','systemd-networkd','systemd-resolved','systemd-logind'],
         tip:'<code>systemctl cat nginx</code> shows the vendor unit file plus any overrides applied.'},
        {id:'usr-lib-udev',name:'/usr/lib/udev',cat:'kernel',label:'udev/',
         type:'udev rules & helpers',
         role:'udev rules shipped by packages and hardware detection helper programs.',
         desc:'Rules files match device attributes and trigger actions (run a program, create a symlink, set permissions, rename interface). Processed in numerical filename order. 99-*.rules run last.',
         perms:'drwxr-xr-x  root root',
         files:['rules.d/','rules.d/50-udev-default.rules','rules.d/60-persistent-storage.rules','rules.d/60-persistent-input.rules','rules.d/60-persistent-v4l.rules','rules.d/70-snap.rules','rules.d/80-net-setup-link.rules','rules.d/99-systemd.rules','hwdb.d/','hwdb.bin','net/'],
         tip:'<code>udevadm monitor</code> watches udev events live. <code>udevadm info -a -n /dev/sda</code> shows a device\'s attributes.'},
        {id:'usr-lib-modules',name:'/usr/lib/modules',cat:'kernel',label:'modules/',
         type:'kernel modules (usr)',
         role:'On some distros (Fedora/RHEL), kernel modules are placed under /usr/lib/modules/ rather than /lib/modules/.',
         desc:'Same structure as /lib/modules/ — kernel version subdirectory containing the full module tree. On Debian/Ubuntu, /lib/modules/ → /usr/lib/modules/ is a symlink.',
         perms:'drwxr-xr-x  root root',
         files:['6.8.0-51-generic/','kernel/','modules.dep','modules.alias','modules.builtin'],
         tip:'<code>modinfo <module_name></code> shows a module\'s description, parameters, and dependencies.'},
      ]},
     {id:'usr-local',name:'/usr/local',cat:'kernel',label:'local',
      type:'local installs',
      role:'Software compiled and installed locally by the sysadmin, outside the package manager.',
      desc:'FHS-mandated safe zone. /usr/local/bin takes precedence over /usr/bin in the default PATH. Common for custom-compiled software and manually managed tools.',
      perms:'drwxr-xr-x  root root',
      files:['bin/','lib/','share/','include/','etc/','sbin/','man/'],
      tip:'<code>make install</code> defaults to /usr/local/. Use <code>./configure --prefix=/usr/local</code>.',
      children:[
        {id:'usr-local-bin',name:'/usr/local/bin',cat:'kernel',label:'bin/',
         type:'local user binaries',
         role:'Admin-installed executables that take precedence over /usr/bin.',
         desc:'Anything installed via make install, cargo install --root /usr/local, pip install to system, or manually placed. First in default PATH over /usr/bin so local versions override distro packages.',
         perms:'drwxr-xr-x  root root',
         files:['custom-tool','compiled-app'],
         tip:'<code>echo $PATH</code> — /usr/local/bin should appear before /usr/bin.'},
      ]},
     {id:'usr-share',name:'/usr/share',cat:'kernel',label:'share',
      type:'arch-independent data',
      role:'Read-only architecture-independent data: man pages, icons, themes, locale data, timezones.',
      desc:'Shared across all CPU architectures. Man pages, documentation, fonts, timezone definitions (zoneinfo/), desktop entries and application data files all live here.',
      perms:'drwxr-xr-x  root root',
      files:['man/','doc/','info/','locale/','zoneinfo/','icons/','themes/','fonts/','applications/','bash-completion/','vim/','emacs/','dict/','pixmaps/','common-licenses/','ca-certificates/'],
      tip:'<code>ls /usr/share/zoneinfo/</code> lists all timezone definitions. <code>manpath</code> shows where man looks.'},
     {id:'usr-include',name:'/usr/include',cat:'kernel',label:'include',
      type:'C/C++ header files',
      role:'Standard C and C++ header files used by the compiler during software builds.',
      desc:'When you #include <stdio.h> the compiler looks here. Contains headers for glibc, POSIX interfaces, and installed library APIs (OpenSSL, libcurl, etc.).',
      perms:'drwxr-xr-x  root root',
      files:['stdio.h','stdlib.h','string.h','unistd.h','sys/','linux/','bits/','openssl/','curl/','libxml2/','python3.12/','netinet/','arpa/','pthread.h','signal.h','errno.h','fcntl.h','math.h','asm/unistd_64.h'],
      tip:'Install <code>build-essential</code> or <code>base-devel</code> to fully populate this directory.'},
   ]},

  //───────────── /lib ─────────────
  {id:'lib',name:'/lib',cat:'kernel',label:'/lib',badge:'→ /usr/lib',
   type:'boot-essential libraries',
   role:'Essential shared libraries required by /bin and /sbin before /usr is mounted.',
   desc:'Contains the C standard library, the dynamic linker itself, and kernel modules. On modern distros this is a symlink to /usr/lib.',
   perms:'lrwxrwxrwx  root root → usr/lib',
   files:['libc.so.6','libm.so.6','ld-linux.so.2','ld-linux-x86-64.so.2','modules/','firmware/','systemd/'],
   tip:'<code>ls /lib/modules/$(uname -r)/</code> shows kernel modules for the running kernel.',
   children:[
     {id:'lib-modules',name:'/lib/modules',cat:'kernel',label:'modules/',
      type:'kernel modules',
      role:'Loadable kernel modules (.ko files) — drivers, filesystems, network protocols, crypto.',
      desc:'Each subdirectory is named after a kernel version (uname -r). modprobe reads modules.dep to resolve dependencies. modules.alias maps hardware IDs (PCI, USB) to module names for udev autoloading.',
      perms:'drwxr-xr-x  root root',
      files:['6.8.0-51-generic/','kernel/','kernel/drivers/','kernel/net/','kernel/fs/','kernel/crypto/','kernel/sound/','kernel/security/','modules.dep','modules.alias','modules.builtin','modules.builtin.modinfo','modules.blacklist','modules.order','modules.symbols'],
      tip:'<code>lsmod</code> shows loaded modules. <code>modinfo <module></code> shows metadata and parameters.',
      children:[
        {id:'lib-modules-drivers',name:'drivers/',cat:'kernel',label:'drivers/',
         type:'hardware driver modules',
         role:'Kernel modules for all hardware: NICs, GPUs, USB, storage controllers, input devices.',
         desc:'Subdirectories by bus type or device class. The kernel loads these when udev detects matching hardware via the alias table. Built-in modules are compiled into vmlinuz; these are loadable (.ko.gz).',
         perms:'drwxr-xr-x  root root',
         files:['net/','net/ethernet/','net/wireless/','net/ethernet/intel/e1000e.ko','net/wireless/iwlwifi.ko','gpu/','gpu/drm/','gpu/drm/amd/','gpu/drm/i915.ko','gpu/drm/nouveau.ko','usb/','usb/storage/usb-storage.ko','usb/hid/usbhid.ko','block/','block/nvme.ko','block/virtio_blk.ko','input/','input/keyboard/atkbd.ko','ata/','ata/ahci.ko','ata/libata.ko','crypto/','char/','i2c/','platform/','virtio/','scsi/'],
         tip:'<code>lspci -k</code> shows which kernel driver is bound to each PCI device.'},
        {id:'lib-modules-net',name:'net/',cat:'kernel',label:'net/',
         type:'network protocol modules',
         role:'Kernel modules implementing network protocols and features.',
         desc:'Loaded on demand as protocols are used. iptables rules trigger loading of netfilter modules. VPNs load tunnel modules. Bridge/bond/vlan modules needed for complex networking.',
         perms:'drwxr-xr-x  root root',

  //───────────── /lib64 ─────────────
  {id:'lib64',name:'/lib64',cat:'kernel',label:'/lib64',badge:'→ /usr/lib',
   type:'64-bit dynamic linker',
   role:'On 64-bit x86 systems: the 64-bit version of the dynamic linker and ABI-specific libraries.',
   desc:'On multilib systems /lib holds 32-bit and /lib64 holds 64-bit. On most modern 64-bit-only systems this is a symlink to /usr/lib. The dynamic linker ld-linux-x86-64.so.2 is the very first code executed in any dynamically-linked ELF binary.',
   perms:'lrwxrwxrwx  root root → usr/lib',
   files:['ld-linux-x86-64.so.2'],
   tip:'<code>file /lib64/ld-linux-x86-64.so.2</code> confirms the 64-bit ELF dynamic linker. <code>ldd --version</code> shows glibc version.'},

  //───────────── /boot ─────────────
  {id:'boot',name:'/boot',cat:'kernel',label:'/boot',
   type:'boot partition files',
   role:'Files needed to boot the OS: kernel image, initial ramdisk, and bootloader config.',
   desc:'Loaded by GRUB before the kernel takes over. Often on its own small partition (ext2/FAT32). The EFI System Partition may be mounted at /boot/efi.',
   perms:'drwxr-xr-x  root root',
   files:['vmlinuz','vmlinuz-6.8.0-51-generic','initrd.img','initrd.img-6.8.0-51-generic','System.map-6.8.0-51-generic','config-6.8.0-51-generic','grub/','efi/'],
   tip:'<code>update-grub</code> regenerates /boot/grub/grub.cfg from installed kernels.',
   children:[
     {id:'boot-vmlinuz',name:'vmlinuz',cat:'kernel',label:'vmlinuz',
      type:'compressed kernel image',
      role:'The compressed Linux kernel binary. Loaded by the bootloader into RAM at boot.',
      desc:'vmlinuz = virtual memory linux, z = zlib/lz4/zstd compressed. The actual kernel binary. Multiple versions coexist during upgrades. GRUB selects which one to load from grub.cfg. /boot/vmlinuz is often a symlink to the latest.',
      perms:'-rw-r--r--  root root',
      files:['vmlinuz-6.8.0-51-generic','vmlinuz-6.8.0-49-generic','System.map-6.8.0-51-generic','config-6.8.0-51-generic'],
      tip:'<code>uname -r</code> shows the running kernel. <code>ls /boot/vmlinuz*</code> lists all installed kernels.'},
     {id:'boot-initrd',name:'initrd.img',cat:'kernel',label:'initrd.img',
      type:'initial ramdisk',
      role:'Temporary filesystem loaded into RAM before the real root filesystem is mounted.',
      desc:'Contains just enough drivers and tools to detect hardware, load storage drivers, and mount the real root. Essential for encrypted disks (LUKS/dm-crypt), RAID, LVM, and NFS root setups. Built by update-initramfs.',
      perms:'-rw-r--r--  root root',
      files:['initrd.img-6.8.0-51-generic'],
      tip:'<code>lsinitramfs /boot/initrd.img | head -50</code> lists files inside the initrd. <code>update-initramfs -u</code> rebuilds it.'},
     {id:'boot-grub',name:'grub/',cat:'kernel',label:'grub/',
      type:'GRUB2 bootloader data',
      role:'GRUB2 bootloader configuration, modules, and environment block.',
      desc:'grub.cfg is the generated boot menu — never edit it directly. Modules (*.mod) implement filesystem drivers, crypto (for LUKS), and other GRUB features. grubenv persists state across boots.',
      perms:'drwxr-xr-x  root root',
      files:['grub.cfg','grubenv','fonts/','locale/','i386-pc/','x86_64-efi/','unicode.pf2','themes/'],
      tip:'<code>cat /boot/grub/grub.cfg</code> shows all boot menu entries.',
      children:[
        {id:'boot-grub-cfg',name:'grub.cfg',cat:'kernel',label:'grub.cfg',
         type:'generated boot menu',
         role:'The GRUB2 boot menu. Lists all installed kernels and boot options.',
         desc:'Auto-generated by update-grub/grub-mkconfig from scripts in /etc/grub.d/ and settings in /etc/default/grub. Contains menuentry blocks for each installed kernel, recovery entries, and other OS entries from os-prober.',
         perms:'-r--r--r--  root root  (444)',
         files:[],
         tip:'<code>grep menuentry /boot/grub/grub.cfg</code> shows all boot entries. Never edit this directly — run update-grub instead.'},
        {id:'boot-grub-env',name:'grubenv',cat:'kernel',label:'grubenv',
         type:'GRUB environment block',
         role:'1024-byte GRUB environment block. Persists variables across boots.',
         desc:'Stores: boot_success (did last boot succeed?), next-boot (one-time boot override), and other saved state. Used by grub-reboot to set a temporary default. Edited with grub-editenv.',
         perms:'-rw-r--r--  root root',
         files:[],
         tip:'<code>grub-editenv list</code> shows current saved variables. <code>grub-reboot 2</code> reboots to entry 2 once.'},
      ]},
     {id:'boot-efi',name:'efi/',cat:'kernel',label:'efi/',
      type:'EFI System Partition',
      role:'Mount point for the EFI System Partition (ESP) on UEFI systems.',
      desc:'The ESP is FAT32, readable by UEFI firmware before any OS loads. Contains bootloaders for all installed operating systems. efibootmgr manages boot entries stored in NVRAM. Secure Boot keys are stored here too.',
      perms:'drwxr-xr-x  root root',
      files:['EFI/','EFI/ubuntu/','EFI/ubuntu/grubx64.efi','EFI/ubuntu/shimx64.efi','EFI/ubuntu/mmx64.efi','EFI/BOOT/BOOTX64.EFI'],
      tip:'<code>efibootmgr -v</code> shows all UEFI boot entries. <code>ls /boot/efi/EFI/</code> shows installed bootloaders.'},
   ]},

  //───────────── /etc ─────────────
  {id:'etc',name:'/etc',cat:'config',label:'/etc',
   type:'host configuration',
   role:'System-wide configuration files. Host-specific configuration for all installed software.',
   desc:'Originally "etcetera" — now the canonical place for all system-wide editable config. All plain text; only root can write. Applications read their configuration here at startup.',
   perms:'drwxr-xr-x  root root',
   files:['passwd','shadow','group','gshadow','hostname','hosts','fstab','sudoers','resolv.conf','nsswitch.conf','os-release','environment','profile','bash.bashrc','shells','skel/','apt/','systemd/','ssh/','ssl/','cron.d/','logrotate.d/','pam.d/','security/','sysctl.conf','sysctl.d/','netplan/','network/','NetworkManager/','nginx/','apache2/','mysql/','postgresql/','redis/','docker/','ufw/','nftables.conf','iptables/','apparmor/','apparmor.d/','modprobe.d/','modules-load.d/','ld.so.conf','ld.so.conf.d/','grub.d/','default/','audit/','fail2ban/'],
   tip:'<code>grep -r "keyword" /etc/</code> searches all config files. <code>ls -la /etc/</code> shows all config files.',
   children:[
     {id:'etc-passwd',name:'/etc/passwd',cat:'config',label:'passwd',
      type:'user account database',
      role:'The local user account database. One line per user: username:x:UID:GID:GECOS:home:shell.',
      desc:'"x" means the password hash is in /etc/shadow. UIDs 0–999 are system accounts; 1000+ are human users. World-readable so programs can look up usernames by UID.',
      perms:'-rw-r--r--  root root  (644)',
      files:[],
      warn:'Check for unexpected UID=0 entries: <code>awk -F: "($3==0){print}" /etc/passwd</code>',
      tip:'<code>getent passwd username</code> also queries LDAP/NIS. <code>id username</code> shows UID/GID.'},
     {id:'etc-shadow',name:'/etc/shadow',cat:'config',label:'shadow',
      type:'password hashes',
      role:'Hashed passwords and password aging policy. Only root and shadow group can read.',
      desc:'Contains salted SHA-512 hashes ($6$ prefix). Stores: last-changed date, min/max days between changes, warning days, expiry. Locked accounts have ! or * prefix. $1$=MD5 (insecure!), $5$=SHA-256, $6$=SHA-512.',
      perms:'-rw-r-----  root shadow  (640)',
      files:[],
      tip:'<code>sudo passwd -S username</code> shows password status without revealing the hash. <code>chage -l username</code> shows aging info.'},
     {id:'etc-group',name:'/etc/group',cat:'config',label:'group',
      type:'group database',
      role:'Group definitions: group name, password placeholder, GID, and member list.',
      desc:'Format: groupname:x:gid:member1,member2. Critical groups: sudo/wheel (admin), docker (root-equivalent!), disk (raw disk access), shadow (read password hashes), adm (read most logs).',
      perms:'-rw-r--r--  root root  (644)',
      files:[],
      tip:'<code>getent group sudo</code> shows sudo group members. <code>getent group docker</code> — docker group = root equivalent!'},
     {id:'etc-fstab',name:'/etc/fstab',cat:'config',label:'fstab',
      type:'filesystem mount table',
      role:'Static table of filesystems to mount at boot.',
      desc:'Columns: device (UUID=.../dev/...), mount point, filesystem type, options, dump, pass. UUID preferred over /dev/sdX (which can change). Pass 0=no fsck, 1=root first, 2=others. Options: noexec, nosuid, noatime, lazytime.',
      perms:'-rw-r--r--  root root  (644)',
      files:[],
      tip:'<code>mount -a</code> mounts all fstab entries. <code>findmnt --fstab</code> shows them in a tree. <code>findmnt -D</code> shows disk usage.'},
     {id:'etc-hosts',name:'/etc/hosts',cat:'config',label:'hosts',
      type:'static hostname map',
      role:'Static IP-to-hostname mappings consulted before DNS.',
      desc:'Queried before DNS by default (controlled by /etc/nsswitch.conf). Standard entries: 127.0.0.1 localhost, ::1 localhost. Used for DNS blocking (point to 0.0.0.0), local dev aliases, and override DNS in containers.',
      perms:'-rw-r--r--  root root  (644)',
      files:[],
      tip:'Add <code>127.0.0.1 myapp.local</code> for local dev — takes effect immediately. <code>getent hosts hostname</code> tests resolution.'},
     {id:'etc-nsswitch',name:'/etc/nsswitch.conf',cat:'config',label:'nsswitch.conf',
      type:'name service switch',
      role:'Specifies the order and sources for name/identity lookups: passwd, groups, hosts, etc.',
      desc:'Each line: database: source1 source2 [RESULT=action]... For hosts: files → check /etc/hosts first; dns → query DNS. For passwd: files systemd → check /etc/passwd then systemd-userd. Controls getpwnam(), getgrnam(), gethostbyname() resolution order.',
      perms:'-rw-r--r--  root root  (644)',
      files:[],
      tip:'<code>getent passwd username</code> follows nsswitch.conf. <code>getent hosts hostname</code> tests host resolution order.'},
     {id:'etc-sudoers',name:'/etc/sudoers',cat:'config',label:'sudoers',
      type:'sudo privilege policy',
      role:'Defines which users can run which commands as root (or other users) via sudo.',
      desc:'ALWAYS edit with visudo — it validates syntax before saving, preventing lockouts. Format: user HOST=(runas:group) COMMANDS. %group notation. NOPASSWD: for passwordless sudo. Drop-ins in /etc/sudoers.d/ included via #includedir.',

      files:['sudoers','sudoers.d/','sudoers.d/90-cloud-init-users','sudoers.d/README'],
      tip:'<code>sudo visudo</code> to edit safely. <code>sudo -l</code> shows what you can run. <code>sudo -l -U username</code> checks another user.'},
     {id:'etc-resolv',name:'/etc/resolv.conf',cat:'config',label:'resolv.conf',

         desc:'Key hardening options: PermitRootLogin no, PasswordAuthentication no, PubkeyAuthentication yes, AllowUsers alice bob, MaxAuthTries 3, ClientAliveInterval 300, ClientAliveCountMax 2, X11Forwarding no, AllowTcpForwarding no. Port 22 (change to reduce scan noise).',

        {id:'etc-ssh-hostkeys',name:'host keys',cat:'config',label:'host keys',

         role:'The server\'s identity keys — presented to clients on first connection (TOFU model).',

         perms:'-rw-------  root root  (600)',

        {id:'etc-ssh-moduli',name:'moduli',cat:'config',label:'moduli',

      desc:'Defines: frequency (daily/weekly/monthly), retention count (rotate N), compression (compress, delaycompress), post-rotate scripts (to signal daemon to reopen log files — via kill -USR1 or systemctl reload). Run by /etc/cron.daily/logrotate.',

      files:['rsyslog','nginx','apache2','mysql','mariadb','postgresql','redis','mongodb','dpkg','apt','syslog','wtmp','btmp','alternatives','cups','samba','exim4','postfix','fail2ban','openvpn','named','unattended-upgrades'],
      tip:'<code>logrotate -d /etc/logrotate.conf</code> dry-runs rotation. <code>logrotate -f /etc/logrotate.conf</code> forces immediate rotation.'},
     {id:'etc-pam',name:'/etc/pam.d',cat:'config',label:'pam.d/',
      type:'PAM authentication stacks',
      role:'Pluggable Authentication Modules configuration for every PAM-aware service.',
      desc:'Each file is a PAM stack for a service. Lines specify: type (auth/account/password/session), control (required/requisite/sufficient/optional), module path, arguments. Processing order matters. required failures are accumulated and returned at end; requisite fails immediately.',
      perms:'drwxr-xr-x  root root',
      files:['common-auth','common-account','common-password','common-session','sshd','sudo','login','su','su-l','cron','gdm-autologin','gdm-launch-environment','chpasswd','newusers','passwd','useradd','runuser'],
      tip:'<code>cat /etc/pam.d/sshd</code> shows exactly what authentication SSH uses. Changes take effect immediately.',
      children:[
        {id:'etc-pam-common-auth',name:'common-auth',cat:'config',label:'common-auth',
         type:'shared authentication stack',
         role:'The shared authentication PAM stack included by most services.',
         desc:'Defines the authentication chain: pam_faillock.so (count failures), pam_unix.so (check /etc/shadow), pam_google_authenticator.so (TOTP if configured), etc. Services @include this file rather than duplicating logic.',
         perms:'-rw-r--r--  root root',
         files:[],
         tip:'<code>pam_tester.py</code> or <code>pamtester</code> can test PAM stacks without actually logging in.'},
        {id:'etc-pam-sudo',name:'sudo (pam)',cat:'config',label:'sudo',
         type:'sudo PAM stack',
         role:'PAM authentication stack specifically for sudo commands.',
         desc:'Typically includes common-auth and common-account. Can add pam_google_authenticator for sudo 2FA or pam_access for time-based restrictions. Processed before sudo checks /etc/sudoers.',
         perms:'-rw-r--r--  root root',
         files:[],
         tip:'Adding pam_google_authenticator.so here requires 2FA for every sudo use.'},
      ]},
     {id:'etc-security',name:'/etc/security',cat:'config',label:'security/',
      type:'PAM security modules config',
      role:'Configuration files for various PAM security modules: limits, access control, group restrictions.',
      desc:'Used by PAM modules (pam_limits.so, pam_access.so, pam_time.so, pam_group.so). Controls resource limits (ulimits), login access rules, time-based access, and group assignments at login.',
      perms:'drwxr-xr-x  root root',
      files:['limits.conf','limits.d/','access.conf','time.conf','group.conf','namespace.conf','namespace.d/','faillock.conf','pwquality.conf','pwquality.conf.d/','opasswd'],
      tip:'<code>ulimit -a</code> shows current limits. <code>cat /etc/security/limits.conf</code> shows configured limits.',
      children:[
        {id:'etc-security-limits',name:'limits.conf',cat:'config',label:'limits.conf',
         type:'resource limits (ulimits)',
         role:'Defines per-user and per-group resource limits applied at login via pam_limits.so.',
         desc:'Format: domain type item value. domain: username, @group, *, %. type: soft (warning), hard (ceiling). items: nofile (open files), nproc (processes), memlock (locked memory), core (core dump size), stack, cpu (CPU seconds), data, fsize. Drop-ins in limits.d/.',
         perms:'-rw-r--r--  root root',
         files:['limits.conf','limits.d/','limits.d/90-nproc.conf'],
         tip:'<code>ulimit -a</code> shows current session limits. To increase nofile: add <code>* soft nofile 65535</code> here.'},
        {id:'etc-security-faillock',name:'faillock.conf',cat:'config',label:'faillock.conf',
         type:'account lockout config',
         role:'Configuration for pam_faillock.so: login failure counting and account lockout policy.',
         desc:'Key settings: deny=5 (lock after 5 failures), unlock_time=900 (lockout duration in seconds), fail_interval=900 (window for counting failures), audit (log to audit subsystem), silent (no error message to user). Replaces deprecated pam_tally2.',
         perms:'-rw-r--r--  root root',
         files:[],
         tip:'<code>faillock --user username</code> shows failure count. <code>faillock --user username --reset</code> unlocks.'},
        {id:'etc-security-pwquality',name:'pwquality.conf',cat:'config',label:'pwquality.conf',
         type:'password quality policy',
         role:'Password strength requirements enforced by pam_pwquality.so.',
         desc:'Key settings: minlen=12 (minimum length), dcredit=-1 (require at least 1 digit), ucredit=-1 (uppercase), lcredit=-1 (lowercase), ocredit=-1 (special char), maxrepeat=3, maxsequence=4, gecoscheck=1 (no username in password), dictcheck=1 (cracklib dict check).',
         perms:'-rw-r--r--  root root',
         files:[],
         tip:'<code>pwscore</code> tests a password against the configured policy. Lower score = weaker password.'},
      ]},
     {id:'etc-sysctl',name:'/etc/sysctl.conf',cat:'config',label:'sysctl.conf',
      type:'kernel runtime parameters',
      role:'Persistent kernel parameters applied at boot via the /proc/sys interface.',
      desc:'Key=value pairs mapping to /proc/sys/ paths. Drop-ins in /etc/sysctl.d/ (processed in alphabetical order before sysctl.conf). Common security settings, network performance tuning, and memory management options.',
      perms:'-rw-r--r--  root root',
      files:['sysctl.conf','sysctl.d/','sysctl.d/10-network-security.conf','sysctl.d/10-ptrace.conf','sysctl.d/10-kernel-hardening.conf'],
      tip:'<code>sysctl -a</code> shows all current values. <code>sysctl -p</code> reloads without rebooting.',
      children:[
        {id:'etc-sysctl-kernel',name:'kernel.*',cat:'config',label:'kernel.*',
         type:'kernel security tunables',
         role:'Critical kernel security and behavior parameters.',
         desc:'dmesg_restrict=1: only root reads dmesg. kptr_restrict=2: hides kernel addresses from /proc/kallsyms. randomize_va_space=2: full ASLR. yama/ptrace_scope=1: only parent can ptrace child (prevents injection). perf_event_paranoid=3: no unprivileged hardware counters. unprivileged_userns_clone=0: no unprivileged user namespaces.',
         perms:'-rw-r--r--  root root',
         files:['kernel/dmesg_restrict','kernel/kptr_restrict','kernel/randomize_va_space','kernel/yama/ptrace_scope','kernel/perf_event_paranoid','kernel/unprivileged_bpf_disabled','kernel/pid_max','kernel/core_pattern','kernel/core_uses_pid'],
         tip:'<code>sysctl kernel.randomize_va_space</code> checks ASLR status. Value 2 = full ASLR required for security.'},
        {id:'etc-sysctl-net',name:'net.*',cat:'config',label:'net.*',
         type:'network stack tunables',
         role:'Network performance and security parameters.',
         desc:'net.ipv4.tcp_syncookies=1: SYN flood defense. net.ipv4.ip_forward=0/1: routing/NAT. net.ipv4.conf.all.rp_filter=1: strict reverse path filtering. net.core.somaxconn=65535: max connection backlog. net.ipv4.conf.all.log_martians=1: log packets with impossible source.',
         perms:'-rw-r--r--  root root',
         files:['net/ipv4/ip_forward','net/ipv4/tcp_syncookies','net/ipv4/conf/all/rp_filter','net/ipv4/conf/all/log_martians','net/core/somaxconn','net/core/rmem_max','net/core/wmem_max','net/ipv6/conf/all/disable_ipv6'],
         tip:'<code>sysctl net.ipv4.tcp_syncookies</code> — should be 1 on any internet-facing system.'},
      ]},
     {id:'etc-ssl',name:'/etc/ssl',cat:'config',label:'ssl/',
      type:'TLS certificates & keys',
      role:'TLS/SSL certificates and private keys for system-wide and application use.',
      desc:'certs/ holds the CA certificate bundle and individual certificates. private/ holds private keys (mode 700, root only). Applications like nginx, postfix, ldap reference certs here. update-ca-certificates rebuilds certs/ca-certificates.crt.',
      perms:'drwxr-xr-x  root root',
      files:['certs/','certs/ca-certificates.crt','private/','openssl.cnf','ca-certificates.conf'],
      tip:'<code>update-ca-certificates</code> rebuilds the CA bundle. <code>openssl x509 -in cert.pem -text -noout</code> inspects a certificate.'},
     {id:'etc-netplan',name:'/etc/netplan',cat:'config',label:'netplan/',
      type:'network configuration (Ubuntu)',
      role:'YAML network configuration for Ubuntu\'s Netplan abstraction layer.',
      desc:'Netplan is Ubuntu 17.10+\'s network config layer. YAML files are rendered into either NetworkManager or systemd-networkd config. Supports: static IPs, DHCP, bonds, bridges, VLANs, WiFi, WireGuard.',
      perms:'drwxr-xr-x  root root',
      files:['00-installer-config.yaml','01-netcfg.yaml','50-cloud-init.yaml'],
      tip:'<code>netplan apply</code> applies config live. <code>netplan try</code> applies with 120s auto-revert if you lose access.'},
     {id:'etc-modprobe',name:'/etc/modprobe.d',cat:'config',label:'modprobe.d/',
      type:'kernel module loading config',
      role:'Module blacklisting, loading options, and aliases for the kernel module loader.',
      desc:'Files in this directory are parsed by modprobe and depmod. Blacklisted modules won\'t autoload. Options set default parameters. Aliases can remap module names. Processed alphabetically; all *.conf files are read.',
      perms:'drwxr-xr-x  root root',
      files:['blacklist.conf','blacklist-framebuffer.conf','blacklist-watchdog.conf','blacklist-rare-network.conf','iwlwifi.conf','mdadm.conf','*.conf'],
      tip:'<code>cat /etc/modprobe.d/blacklist.conf</code> shows blacklisted modules. <code>modprobe -n -v modulename</code> simulates loading.',
      children:[
        {id:'etc-modprobe-blacklist',name:'blacklist.conf',cat:'config',label:'blacklist.conf',
         type:'module blacklist',
         role:'Prevents specified kernel modules from being loaded automatically by udev/modprobe.',
         desc:'Format: blacklist modulename (one per line). Common blacklisted: pcspkr (PC speaker beep), nouveau (if using NVIDIA proprietary), bluetooth (if unwanted), usb-storage (kiosk hardening), firewire modules (DMA attack vector). Override with softdep or explicit modprobe.',
         perms:'-rw-r--r--  root root',
         files:[],
         tip:'<code>modprobe -r modulename</code> unloads a module. Add to blacklist.conf to prevent reloading after reboot.'},
      ]},
     {id:'etc-modules-load',name:'/etc/modules-load.d',cat:'config',label:'modules-load.d/',
      type:'modules to load at boot',
      role:'Lists kernel modules to load unconditionally at boot via systemd-modules-load.service.',
      desc:'Each *.conf file contains module names, one per line (comments with #). Used for modules that won\'t be autoloaded by udev but are always needed: tun (for OpenVPN), br_netfilter (for Kubernetes), ip_vs, overlay (for Docker swarm).',
      perms:'drwxr-xr-x  root root',
      files:['modules.conf','k8s.conf','docker.conf','*.conf'],
      tip:'<code>systemctl status systemd-modules-load</code> shows which modules were loaded at boot and any failures.'},
     {id:'etc-ldso',name:'/etc/ld.so.conf',cat:'config',label:'ld.so.conf',
      type:'dynamic linker library paths',
      role:'Specifies directories searched by the dynamic linker for shared libraries.',
      desc:'Usually contains "include /etc/ld.so.conf.d/*.conf". The actual search path entries are in the .conf.d/ drop-in files. After adding a new directory, run ldconfig to rebuild the binary cache /etc/ld.so.cache.',
      perms:'-rw-r--r--  root root',
      files:['ld.so.conf','ld.so.conf.d/','ld.so.conf.d/x86_64-linux-gnu.conf','ld.so.conf.d/fakeroot-x86_64-linux-gnu.conf','ld.so.cache','ld.so.preload'],
      tip:'<code>ldconfig -p | grep libssl</code> finds SSL library paths. <code>ldconfig -n /usr/local/lib</code> registers new library dir.',
      children:[
        {id:'etc-ldso-preload',name:'ld.so.preload',cat:'config',label:'ld.so.preload',
         type:'force-preloaded libraries',
         role:'Forces loading of specified .so files into every single process before all others.',
         desc:'Loaded before libc itself — the ultimate hook point. Legitimate uses: preload debugging/profiling libraries, malloc replacement (jemalloc, tcmalloc), tracing tools. Major security risk if attackers can write here: root-planted library intercepts all function calls system-wide.',
         perms:'-rw-r--r--  root root',
         files:[],
         tip:'<code>cat /etc/ld.so.preload</code> — should normally be empty or absent. Any entry here is injected into EVERY process.'},
      ]},
     {id:'etc-grub-d',name:'/etc/grub.d',cat:'config',label:'grub.d/',
      type:'GRUB config generator scripts',
      role:'Scripts that generate the /boot/grub/grub.cfg boot menu when update-grub is run.',
      desc:'Run in numerical order by grub-mkconfig. Each script outputs menu entries to stdout which are concatenated into grub.cfg. 40_custom is the canonical place for user-defined boot entries without being overwritten on updates.',
      perms:'drwxr-xr-x  root root',
      files:['00_header','05_debian_theme','10_linux','20_linux_xen','30_os-prober','40_custom','41_custom','README'],
      tip:'<code>update-grub</code> (= grub-mkconfig -o /boot/grub/grub.cfg) regenerates the boot menu.',
      children:[
        {id:'etc-grub-default',name:'/etc/default/grub',cat:'config',label:'default/grub',
         type:'GRUB defaults',
         role:'User-editable GRUB settings: default entry, timeout, kernel cmdline, theme.',
         desc:'Key variables: GRUB_DEFAULT=0 (which menu entry boots by default), GRUB_TIMEOUT=5 (seconds to wait), GRUB_CMDLINE_LINUX_DEFAULT="quiet splash" (kernel parameters), GRUB_CMDLINE_LINUX="" (always-added params), GRUB_DISABLE_RECOVERY=true, GRUB_GFXMODE=1920x1080.',
         perms:'-rw-r--r--  root root',
         files:[],
         tip:'After editing, run <code>update-grub</code> to apply. Add <code>ipv6.disable=1</code> to GRUB_CMDLINE_LINUX to disable IPv6 at kernel level.'},
      ]},
     {id:'etc-audit',name:'/etc/audit',cat:'config',label:'audit/',
      type:'Linux audit daemon config',
      role:'auditd configuration and audit rules for the Linux Audit Framework.',
      desc:'auditd is the userspace component of the Linux Audit System. Rules define which system calls and file accesses to audit. Results go to /var/log/audit/audit.log. Required for CIS/STIG compliance.',
      perms:'drwxr-xr-x  root root',
      files:['auditd.conf','audit.rules','rules.d/','rules.d/10-base-config.rules','rules.d/20-dont-audit.rules','rules.d/30-stig.rules','rules.d/40-local.rules','rules.d/99-finalize.rules'],
      tip:'<code>auditctl -l</code> lists active rules. <code>ausearch -k keyname</code> searches audit log by key.',
      children:[
        {id:'etc-audit-conf',name:'auditd.conf',cat:'config',label:'auditd.conf',
         type:'audit daemon config',
         role:'Controls auditd behavior: log file location, size, rotation, and disk-full action.',
         desc:'Key settings: log_file=/var/log/audit/audit.log, max_log_file=50 (MB per file), num_logs=5 (files to keep), max_log_file_action=ROTATE, space_left_action=SYSLOG (warn when disk low), disk_full_action=HALT (stop system if disk full — prevents log loss), disk_error_action=SYSLOG.',
         perms:'-rw-r--r--  root root',
         files:[],
         tip:'<code>service auditd status</code> checks daemon. <code>auditctl -s</code> shows kernel audit subsystem status.'},
        {id:'etc-audit-rules',name:'rules.d/',cat:'config',label:'rules.d/',
         type:'audit rules',
         role:'Drop-in audit rule files that define what to audit.',
         desc:'Rule types: -w (watch a file/dir), -a (always/never audit a syscall), -e (enable/disable audit, set immutable). Common rules: watch /etc/passwd, /etc/shadow, /etc/sudoers. Log execve (all commands), setuid calls, network changes. -e 2 in 99-finalize.rules makes rules immutable until reboot.',
         perms:'drwxr-xr-x  root root',
         files:['10-base-config.rules','20-dont-audit.rules','30-stig.rules','40-local.rules','99-finalize.rules'],
         tip:'<code>augenrules --load</code> compiles rules.d/ into audit.rules and loads them. <code>auditctl -l</code> verifies.'},
      ]},
     {id:'etc-fail2ban',name:'/etc/fail2ban',cat:'config',label:'fail2ban/',
      type:'fail2ban intrusion prevention',
      role:'fail2ban configuration: jails, filters, and actions for banning malicious IPs.',
      desc:'fail2ban monitors log files for repeated failed authentication attempts and bans offending IPs via iptables/nftables. jail.conf defines monitoring rules; jail.local overrides them. Filters are regex patterns to detect failures. Actions define how to ban (iptables, firewalld, cloudflare).',
      perms:'drwxr-xr-x  root root',
      files:['fail2ban.conf','jail.conf','jail.local','jail.d/','filter.d/','filter.d/sshd.conf','filter.d/nginx-http-auth.conf','filter.d/apache-auth.conf','action.d/','action.d/iptables-multiport.conf','action.d/sendmail-whois.conf'],
      tip:'<code>fail2ban-client status</code> shows all jails. <code>fail2ban-client status sshd</code> shows SSH ban details.'},
     {id:'etc-apparmor',name:'/etc/apparmor.d',cat:'config',label:'apparmor.d/',
      type:'AppArmor security profiles',
      role:'AppArmor Mandatory Access Control profiles defining what each program can access.',
      desc:'Each file is a profile for a specific executable. Profiles can be in enforce mode (denies + logs) or complain mode (logs only). Profiles define: file access rules, capability grants, network access, ptrace restrictions, signal permissions. Ubuntu ships profiles for nginx, sshd, cups, etc.',
      perms:'drwxr-xr-x  root root',
      files:['usr.sbin.nginx','usr.sbin.sshd','usr.sbin.cups','usr.bin.man','usr.lib.snapd.snap-confine','abstractions/','tunables/','local/'],
      tip:'<code>aa-status</code> shows loaded profiles and their mode. <code>aa-logprof</code> generates new profile rules from denials.'},
     {id:'etc-nginx',name:'/etc/nginx',cat:'config',label:'nginx/',
      type:'nginx web server config',
      role:'Nginx global configuration, virtual host definitions, and shared snippets.',
      desc:'nginx.conf is the main config. sites-available/ holds all vhost configs; sites-enabled/ has symlinks to active ones (nginx-style enable/disable). conf.d/ holds additional config snippets. mime.types maps file extensions to Content-Type headers.',
      perms:'drwxr-xr-x  root root',
      files:['nginx.conf','sites-available/','sites-available/default','sites-enabled/','conf.d/','snippets/','snippets/fastcgi-php.conf','snippets/ssl-params.conf','modules-available/','modules-enabled/','mime.types','fastcgi.conf','fastcgi_params','scgi_params','uwsgi_params'],
      tip:'<code>nginx -t</code> tests config. <code>nginx -T</code> dumps full resolved config. <code>nginx -s reload</code> graceful reload.',
      children:[
        {id:'etc-nginx-sites',name:'sites-available/',cat:'config',label:'sites-available/',
         type:'nginx vhost definitions',
         role:'All virtual host configuration files. Activate a site by symlinking into sites-enabled/.',
         desc:'Each file typically defines one virtual host with server{} blocks. Contains: server_name (domain), listen (port/SSL), root (document root), SSL certificate paths, location blocks for routing, proxy_pass for reverse proxy, FastCGI config for PHP.',
         perms:'drwxr-xr-x  root root',
         files:['default','mysite.conf','api.conf'],
         tip:'<code>ln -s /etc/nginx/sites-available/mysite /etc/nginx/sites-enabled/</code> enables a site. <code>nginx -t && nginx -s reload</code> to apply.'},
      ]},
   ]},

  //───────────── /var ─────────────
  {id:'var',name:'/var',cat:'var',label:'/var',
   type:'variable data',
   role:'Variable data — files that change continuously during normal system operation.',
   desc:'Unlike /usr (mostly static), /var grows over time. Put on its own partition to prevent log overflow from filling the root filesystem. Contains logs, spools, caches, library data, and runtime state.',
   perms:'drwxr-xr-x  root root',
   files:['log/','spool/','cache/','lib/','run/','mail/','www/','tmp/','lock/','opt/','local/','backups/'],
   tip:'<code>du -sh /var/*</code> shows which subdirectory consumes the most space.',
   children:[

   // ── /var/log ──
   {id:'var-log',name:'/var/log',cat:'var',label:'log/',
    type:'system & application logs',
    role:'Primary location for all system and application log files.',
    desc:'Most logs use rotating text files (.1/.2.gz suffixes) managed by logrotate. systemd-journald stores structured binary logs under journal/. Critical for debugging, security auditing, and forensic investigation.',
    perms:'drwxr-xr-x  root root  (755)',
    files:['syslog','auth.log','kern.log','daemon.log','user.log','debug','messages','mail.log','mail.err','mail.info','mail.warn','dpkg.log','apt/','apt/history.log','apt/term.log','nginx/','apache2/','mysql/','mariadb/','postgresql/','redis/','mongodb/','elasticsearch/','audit/','audit/audit.log','journal/','fail2ban.log','ufw.log','cloud-init.log','cloud-init-output.log','dmesg','boot.log','wtmp','btmp','lastlog','faillog','tallylog','Xorg.0.log','cups/','samba/','openvpn/','lpr.log','cron.log','landscape/','unattended-upgrades/'],
    tip:'<code>tail -f /var/log/syslog</code> follows live. <code>journalctl -f</code> follows journal. <code>ls -lht /var/log/</code> shows newest logs.',
    children:[

    {id:'log-syslog',name:'syslog',cat:'var',label:'syslog',
     type:'general system log',
     role:'Central log receiving messages from nearly all daemons via the syslog protocol (RFC 5424).',
     desc:'Produced by rsyslog or syslog-ng. Contains timestamped entries from kernel, cron, network services, and any application calling syslog(3). Fields: timestamp, hostname, program[PID], message. Rotated daily, 7 compressed archives kept. On RHEL/CentOS/Fedora the equivalent is /var/log/messages.',
     perms:'-rw-r--r--  syslog adm  (644)',
     files:['syslog','syslog.1','syslog.2.gz','syslog.3.gz','syslog.4.gz','syslog.5.gz','syslog.6.gz','syslog.7.gz'],
     tip:'<code>grep "error\\|Error\\|ERROR" /var/log/syslog | tail -50</code> finds recent errors. <code>journalctl --since "1 hour ago"</code> for journal.'},

    {id:'log-auth',name:'auth.log',cat:'var',label:'auth.log',
     type:'authentication & authorization log',
     role:'All authentication and authorisation events: logins, sudo uses, SSH attempts, su commands, PAM events.',
     desc:'Critical for security auditing. Logged by PAM, sshd, sudo, login, su. Contains: "Failed password for user from IP", "Accepted publickey for user", "session opened for user by (uid=0)", "COMMAND=/bin/bash". RHEL/CentOS equivalent: /var/log/secure.',
     perms:'-rw-r-----  root adm  (640)',
     files:['auth.log','auth.log.1','auth.log.2.gz'],
     tip:'<code>grep "Failed password" /var/log/auth.log | awk \'{print $11}\' | sort | uniq -c | sort -rn | head -20</code> — top attacking IPs.',
     children:[
       {id:'log-auth-ssh',name:'SSH events',cat:'var',label:'SSH in auth.log',
        type:'SSH authentication records',
        role:'SSH daemon login attempts, successes, key fingerprints, and disconnects.',
        desc:'Key patterns: "Accepted publickey for USERNAME from IP port PORT ssh2: RSA/ED25519 SHA256:FINGERPRINT" (success), "Failed password for USERNAME from IP" (brute force), "Invalid user USERNAME from IP" (nonexistent user), "Disconnected from authenticating user root IP" (rejected), "Received disconnect from IP: 11: Normal Shutdown" (clean disconnect). Check for "Did not receive identification string" (scanners).',
        perms:'-rw-r-----  root adm',
        files:[],
        tip:'<code>grep "Accepted" /var/log/auth.log | awk \'{print $1,$2,$3,$9,$11}\' </code> shows successful SSH logins with time, user, IP.'},
       {id:'log-auth-sudo',name:'sudo events',cat:'var',label:'sudo in auth.log',
        type:'sudo command audit trail',
        role:'Every sudo command execution including the command run, user, and TTY.',
        desc:'Format: "username : TTY=pts/0 ; PWD=/home/user ; USER=root ; COMMAND=/bin/bash". Captures: successful sudo uses, failed attempts (wrong password), sudo -i/sudo su escalations, sudo policy violations ("is not in the sudoers file"). Also: sudo session open/close via PAM.',
        perms:'-rw-r-----  root adm',
        files:[],
        tip:'<code>grep sudo /var/log/auth.log | grep COMMAND</code> shows all commands run with sudo.'},
     ]},

    {id:'log-kern',name:'kern.log',cat:'var',label:'kern.log',
     type:'kernel message log',
     role:'Kernel ring buffer messages: hardware events, driver loading/failures, OOM kills, filesystem errors.',
     desc:'Similar to dmesg but persisted across reboots. Key events: OOM Killer ("Killed process PID (name) total-vm:NkB, anon-rss:NkB"), hardware errors ("ECC memory error"), driver issues ("pcieport: AER: Corrected error received"), filesystem errors ("EXT4-fs error"). Also: USB device detection, network interface state changes.',
     perms:'-rw-r-----  root adm  (640)',
     files:['kern.log','kern.log.1','kern.log.2.gz'],
     tip:'<code>grep "OOM\\|Out of memory\\|Killed process" /var/log/kern.log</code> finds OOM events. <code>dmesg -T</code> shows with human-readable timestamps.'},

    {id:'log-daemon',name:'daemon.log',cat:'var',label:'daemon.log',
     type:'daemon process log',
     role:'Log messages from background system daemons not covered by other log files.',
     desc:'Receives messages from daemons that log via syslog with the "daemon" facility. Common sources: NetworkManager, bluetoothd, avahi-daemon, acpid, atd. Useful for diagnosing: network manager events, service startup failures, background service errors. Often overlooked but valuable for daemon troubleshooting.',
     perms:'-rw-r--r--  root adm  (640)',
     files:['daemon.log','daemon.log.1','daemon.log.2.gz'],
     tip:'<code>tail -f /var/log/daemon.log</code> to watch daemon activity. <code>grep NetworkManager /var/log/daemon.log</code> for network events.'},

    {id:'log-user',name:'user.log',cat:'var',label:'user.log',
     type:'user-level message log',
     role:'Log messages from user-level processes (syslog "user" facility). Desktop apps, cron jobs, user scripts.',
     desc:'Catches syslog(LOG_USER, ...) calls from non-daemon processes. Common sources: user-started scripts, cron job output (if cron directs to syslog), desktop session managers, CUPS user-level events. Less critical than auth.log but useful for debugging user application issues.',
     perms:'-rw-r--r--  syslog adm  (644)',
     files:['user.log','user.log.1','user.log.2.gz'],
     tip:'<code>grep "$(date +%b %e)" /var/log/user.log | head -30</code> shows today\'s user log entries.'},

    {id:'log-debug',name:'debug',cat:'var',label:'debug',
     type:'verbose debug log',
     role:'Verbose debug-level syslog messages. Very noisy — disabled on many systems. LOG_DEBUG facility messages.',
     desc:'Contains all LOG_DEBUG level syslog messages. Extremely verbose. Usually disabled in /etc/rsyslog.conf on production systems to avoid disk exhaustion. Useful for temporary debugging by uncommenting the debug line in rsyslog.conf.',
     perms:'-rw-r--r--  root adm',
     files:['debug','debug.1','debug.2.gz'],
     tip:'Enable debug logging: uncomment <code>*.debug\t\t/var/log/debug</code> in /etc/rsyslog.conf. Disable after debugging!'},

    {id:'log-messages',name:'messages',cat:'var',label:'messages',
     type:'general messages log (RHEL/Fedora)',
     role:'RHEL/CentOS/Fedora equivalent of syslog. General system activity log including informational messages.',
     desc:'On Red Hat-based systems this is the primary general-purpose log (equivalent to /var/log/syslog on Debian/Ubuntu). Receives: kernel messages, service start/stop, authentication events (on RHEL, auth events may go here rather than /var/log/secure), cron job output.',
     perms:'-rw-r--r--  root root  (644)',
     files:['messages','messages-20240101','messages-20240108'],
     tip:'On RHEL/CentOS/Fedora: <code>tail -f /var/log/messages</code> replaces <code>tail -f /var/log/syslog</code>.'},

    {id:'log-dmesg',name:'dmesg',cat:'var',label:'dmesg',
     type:'kernel boot messages',
     role:'Kernel ring buffer snapshot from the most recent boot. Not rotated — overwritten each boot.',
     desc:'Contains everything the kernel printed during and after boot: hardware detection, driver initialisation, filesystem mounts, module loading. On systemd systems also available via <code>journalctl -k</code>. The live ring buffer is accessible via <code>dmesg</code> command (reads /dev/kmsg).',
     perms:'-rw-r--r--  root adm',
     files:['dmesg'],
     tip:'<code>dmesg -T --level=err,crit,alert,emerg</code> shows only kernel errors with timestamps. <code>dmesg -w</code> follows live.'},

    {id:'log-boot',name:'boot.log',cat:'var',label:'boot.log',
     type:'boot sequence log',
     role:'Service startup messages during system boot. Shows systemd unit start/stop status.',
     desc:'On systems using sysvinit/upstart or on RHEL with rsyslog boot logging enabled. On systemd systems, boot messages go to the journal: <code>journalctl -b</code> is the modern equivalent. May capture: "Starting ...", "Started ...", "[  OK  ]" / "[ FAIL ]" status lines from rc scripts.',
     perms:'-rw-r--r--  root root  (644)',
     files:['boot.log','boot.log.1'],
     tip:'<code>journalctl -b</code> shows this boot\'s journal. <code>journalctl -b -1</code> shows previous boot. <code>systemd-analyze blame</code> shows boot time per unit.'},

    {id:'log-dpkg',name:'dpkg.log',cat:'var',label:'dpkg.log',
     type:'package manager history',
     role:'Complete audit trail of all dpkg/APT package operations: installs, upgrades, purges, configurations.',
     desc:'Every apt install/remove/upgrade/autoremove/purge is recorded with timestamps, package names, and versions. Fields: date time status package version. Statuses: install, upgrade, remove, purge, half-installed, config-files, unpacked, installed. apt/history.log has a higher-level apt-specific summary including full command lines.',
     perms:'-rw-r--r--  root root  (644)',
     files:['dpkg.log','dpkg.log.1','dpkg.log.2.gz','apt/history.log','apt/term.log'],
     tip:'<code>grep "install " /var/log/dpkg.log | grep "$(date +%Y-%m-%d)"</code> shows today\'s installs. Useful for forensic auditing.'},

    {id:'log-apt',name:'apt/',cat:'var',label:'apt/',
     type:'APT operation logs',
     role:'APT package manager detailed logs: command history and terminal output.',
     desc:'history.log: one entry per apt invocation with: Start-Date, Commandline (the exact apt command run), Install/Upgrade/Remove lists, End-Date. term.log: raw terminal output including interactive prompts and progress bars. Essential for auditing what was installed and when.',
     perms:'drwxr-xr-x  root root',
     files:['history.log','history.log.1.gz','term.log','term.log.1.gz'],
     tip:'<code>cat /var/log/apt/history.log | grep -A5 "Commandline: apt install"</code> shows install sessions.'},

    {id:'log-nginx-dir',name:'nginx/',cat:'var',label:'nginx/',
     type:'nginx web server logs',
     role:'Nginx HTTP access records (one per request) and error messages.',
     desc:'access.log: Combined Log Format — client IP, ident, auth user, [timestamp], "METHOD /path HTTP/1.x", status_code, bytes_sent, "Referer", "User-Agent". error.log: upstream failures, SSL errors, config reload issues, permission denied, 502/504 responses. Each vhost can have separate log files.',
     perms:'drwxr-x---  www-data adm  (750)',
     files:['access.log','error.log','access.log.1','error.log.1','access.log.2.gz','error.log.2.gz'],
     tip:'<code>awk \'{print $9}\' /var/log/nginx/access.log | sort | uniq -c | sort -rn</code> counts HTTP status codes.',
     children:[
       {id:'log-nginx-access',name:'access.log',cat:'var',label:'access.log',
        type:'HTTP request log',
        role:'One line per HTTP request to nginx. The primary record of all web traffic.',
        desc:'Standard Combined Log Format fields: %h (client IP) %l (ident, always -) %u (auth user) [%t] (time) "%r" (request line: METHOD URL HTTP/ver) %>s (status code) %b (bytes) "%{Referer}i" "%{User-Agent}i". Useful for: traffic analysis, attack detection (SQLi/XSS patterns in URLs), rate limiting, bot detection, CDN debugging.',
        perms:'-rw-r-----  www-data adm',
        files:[],
        tip:'<code>awk \'{print $1}\' /var/log/nginx/access.log | sort | uniq -c | sort -rn | head -20</code> shows top client IPs by request count.'},
       {id:'log-nginx-error',name:'error.log',cat:'var',label:'error.log',
        type:'nginx error log',
        role:'Nginx errors: startup failures, upstream connection problems, SSL issues, permission denials.',
        desc:'Log format: YYYY/MM/DD HH:MM:SS [level] PID#TID: *CONNECTION_ID message. Levels: debug, info, notice, warn, error (default), crit, alert, emerg. Common entries: connect() to upstream failed (502), SSL_do_handshake() failed, open() "/path" failed (permission denied), no space left on device.',
        perms:'-rw-r-----  www-data adm',
        files:[],
        tip:'Set <code>error_log /var/log/nginx/error.log debug;</code> in nginx.conf for verbose debugging (very noisy, disable in prod).'},
     ]},

    {id:'log-apache',name:'apache2/',cat:'var',label:'apache2/',
     type:'Apache HTTP Server logs',
     role:'Apache web server access logs, error log, and optional mod_security audit log.',
     desc:'access.log / other_vhosts_access.log: HTTP requests in Combined Log Format. error.log: server errors, PHP fatal errors, module errors, SSL issues. modsec_audit.log: mod_security WAF events if installed. Each VirtualHost can define CustomLog and ErrorLog directives for per-site logs.',
     perms:'drwxr-x---  root adm  (750)',
     files:['access.log','error.log','other_vhosts_access.log','modsec_audit.log','access.log.1','error.log.1'],
     tip:'<code>grep " 5[0-9][0-9] " /var/log/apache2/access.log | tail -20</code> shows recent 5xx server errors.'},

    {id:'log-mysql-dir',name:'mysql/',cat:'var',label:'mysql/',
     type:'MySQL/MariaDB database logs',
     role:'Database server logs: startup errors, slow queries, replication, and general query log.',
     desc:'error.log: startup/shutdown events, InnoDB status, replication errors, fatal server errors. mysql-slow.log / mariadb-slow.log: queries exceeding long_query_time seconds (controlled in my.cnf). general.log: EVERY query (very verbose — use only for debugging, disable in production). Binary logs (in /var/lib/mysql/): row-based or statement-based replication log.',
     perms:'drwxrwx---  mysql mysql  (770)',
     files:['error.log','mysql-slow.log','mariadb.log','mariadb-slow.log','mysql.log'],
     tip:'<code>mysqladmin -u root -p flush-logs</code> rotates logs. <code>mysqldumpslow /var/log/mysql/mysql-slow.log</code> analyzes slow queries.'},

    {id:'log-postgresql-dir',name:'postgresql/',cat:'var',label:'postgresql/',
     type:'PostgreSQL database logs',
     role:'PostgreSQL server logs: connections, queries, errors, autovacuum, replication.',
     desc:'postgresql-<version>-main.log: All server activity. Controlled by postgresql.conf: log_connections, log_disconnections, log_duration (slow query threshold), log_statement (none/ddl/mod/all), log_autovacuum_min_duration, log_line_prefix (format). Very configurable — can log all queries or just slow ones.',
     perms:'drwxr-xr-x  postgres postgres',
     files:['postgresql-16-main.log','postgresql-16-main.log.1'],
     tip:'<code>tail -f /var/log/postgresql/postgresql-*-main.log</code> follows the DB log. Check for "FATAL: role does not exist" authentication errors.'},

    {id:'log-redis-dir',name:'redis/',cat:'var',label:'redis/',
     type:'Redis in-memory data store log',
     role:'Redis server log: startup, connections, memory warnings, persistence events, and cluster info.',
     desc:'redis-server.log: Redis startup config, listening address, RDB/AOF persistence status, memory usage warnings (when approaching maxmemory), connection events, slow queries (slowlog). Format: PID:role timestamp loglevel message. Roles: M=master, S=slave/replica, C=child (saving), X=sentinel.',
     perms:'drwxr-xr-x  redis redis',
     files:['redis-server.log','redis-server.log.1'],
     tip:'<code>redis-cli SLOWLOG GET 10</code> shows slowest recent commands. <code>redis-cli INFO all</code> shows complete server status.'},

    {id:'log-mongodb-dir',name:'mongodb/',cat:'var',label:'mongodb/',
     type:'MongoDB database log',
     role:'MongoDB server log: connections, queries, indexes, replication, and authentication events.',
     desc:'mongod.log: JSON-structured (since 4.4) log entries. Contains: connection establishment/termination, authentication attempts (failed/succeeded), slow operations (exceeding slowOpThresholdMs), index creation/drops, replication state changes, storage engine events. Log levels: F(atal), E(rror), W(arning), I(nformational), D(ebug).',
     perms:'drwxr-xr-x  mongodb mongodb',
     files:['mongod.log','mongod.log.1'],
     tip:'<code>mongosh --eval "db.adminCommand({getLog: \'global\'})"</code> reads log from MongoDB shell.'},

    {id:'log-journal-dir',name:'journal/',cat:'var',label:'journal/',
     type:'systemd binary journal',
     role:'systemd-journald structured binary log store. Indexed, searchable, persistent across reboots.',
     desc:'Binary format with rich per-entry metadata: _SYSTEMD_UNIT, _PID, _UID, _GID, _BOOT_ID, PRIORITY (0=emerg to 7=debug), _HOSTNAME, _COMM, _EXE, _CMDLINE, MESSAGE_ID (UUID for categorized messages). Supports: instant field-based filtering, regex, rate limiting, field cardinality. journalctl queries this database.',
     perms:'drwxr-sr-x  root systemd-journal  (2755)',
     files:['<machine-id>/system.journal','<machine-id>/system@<id>.journal','<machine-id>/user-1000.journal','<machine-id>/user-1000@<id>.journal'],
     tip:'<code>journalctl -u nginx -n 100 -f</code> follows nginx journal. <code>journalctl -b -1</code> shows previous boot. <code>journalctl -p err -b</code> shows errors from this boot.',
     children:[
       {id:'log-journal-system',name:'system.journal',cat:'var',label:'system.journal',
        type:'system-wide journal file',
        role:'Binary journal file for all system-level log entries from kernel and all system services.',
        desc:'Structured binary format. Each entry contains: timestamp (microsecond precision), priority, facility, unit name, PID, UID, message text, and any custom fields added by the logging application via sd_journal_send(). Indexed by field for fast queries. Multiple files per machine-id with rotation based on size.',
        perms:'-rw-r-----  root systemd-journal',
        files:[],
        tip:'<code>journalctl --file=/var/log/journal/*/system.journal</code> reads a specific journal file. <code>journalctl --verify</code> checks journal integrity.'},
       {id:'log-journal-user',name:'user-*.journal',cat:'var',label:'user-*.journal',
        type:'per-user journal file',
        role:'Per-user journal for user systemd session services.',
        desc:'Stores log entries from user systemd session units (running in the user\'s systemd --user instance). Contains: user application logs, user timer outputs, user socket activation events. Only the user owning the file (and root/systemd-journal group) can read it.',
        perms:'-rw-r-----  user systemd-journal',
        files:[],
        tip:'<code>journalctl --user -u user-service-name</code> reads a user\'s service journal.'},
     ]},

    {id:'log-audit-dir',name:'audit/',cat:'var',label:'audit/',
     type:'Linux Audit Framework logs',
     role:'auditd log files containing syscall audits, file access records, and SELinux AVC denials.',
     desc:'audit.log: Binary records from the Linux Audit Subsystem. Record types: SYSCALL (syscall invocation with all args), PATH (file referenced by syscall), EXECVE (exec with args), USER_AUTH (authentication), USER_CMD (sudo commands), AVC (SELinux access denial), NETFILTER_PKT (network packet). Key tool: aureport for summaries, ausearch for queries, audit2allow for SELinux.',
     perms:'drwxr-x---  root root  (750)',
     files:['audit.log','audit.log.1','audit.log.2'],
     tip:'<code>aureport -au</code> authentication summary. <code>ausearch --start today -k ssh_login</code> searches by audit key.',
     children:[
       {id:'log-audit-log',name:'audit.log',cat:'var',label:'audit.log',
        type:'audit framework log',
        role:'The primary audit log. Captures syscall activity, file accesses, auth events, and LSM denials.',
        desc:'Fields in each record: type= (record type), msg=audit(TIMESTAMP:SERIAL): (event ID), then type-specific fields. SYSCALL records: syscall= arch= success= exit= pid= ppid= uid= gid= euid= egid= comm= exe= key=. PATH records: name= (file path) nametype= (CREATE/DELETE/NORMAL/PARENT/UNKNOWN). AVC records: avc: denied { operation } for pid= comm= path= scontext= tcontext= tclass=.',
        perms:'-rw-r-----  root root  (600)',
        files:['audit.log','audit.log.1','audit.log.2'],
        tip:'<code>ausearch -x /usr/bin/sudo -ts today</code> shows all sudo executions today. <code>aureport -x</code> shows executable summary.'},
     ]},

    {id:'log-fail2ban',name:'fail2ban.log',cat:'var',label:'fail2ban.log',
     type:'fail2ban intrusion prevention log',
     role:'fail2ban actions: ban/unban events, jail status, and monitored log scan activity.',
     desc:'Records: when an IP is banned (which jail, which log triggered it, the ban duration), unban events (after ban time expires), warning about misconfigured jails, start/stop of the fail2ban service. Format: YYYY-MM-DD HH:MM:SS,mmm fail2ban.COMPONENT [LEVEL] [jail]: MESSAGE IP. Critical for: verifying fail2ban is working, investigating why a legitimate IP was banned, monitoring attack intensity.',
     perms:'-rw-r--r--  root root  (644)',
     files:['fail2ban.log','fail2ban.log.1','fail2ban.log.2.gz'],
     tip:'<code>grep "Ban " /var/log/fail2ban.log | awk \'{print $NF}\' | sort | uniq -c | sort -rn | head -20</code> shows most-banned IPs.'},

    {id:'log-ufw',name:'ufw.log',cat:'var',label:'ufw.log',
     type:'UFW firewall log',
     role:'UFW (Uncomplicated Firewall) log of blocked and allowed connections per firewall rules.',
     desc:'Blocked connections show [UFW BLOCK] prefix; allowed show [UFW ALLOW]. Fields: IN (ingress interface), OUT (egress interface), MAC (layer 2 if available), SRC (source IP), DST (dest IP), LEN, TOS, PREC, TTL, ID, PROTO, SPT (source port), DPT (dest port), WINDOW, RES, SYN/ACK/FIN flags, URGP. Populated by iptables LOG target.',
     perms:'-rw-r-----  root adm  (640)',
     files:['ufw.log','ufw.log.1'],
     tip:'<code>grep "UFW BLOCK" /var/log/ufw.log | awk \'{print $12}\' | sed "s/SRC=//" | sort | uniq -c | sort -rn | head</code> shows top blocked sources.'},

    {id:'log-wtmp',name:'wtmp / btmp / lastlog',cat:'var',label:'wtmp/btmp',
     type:'binary login records',
     role:'Binary records of all login/logout events (wtmp), failed logins (btmp), and last login per user (lastlog).',
     desc:'wtmp (utmp format): every login, logout, reboot, runlevel change. btmp: every failed login attempt. lastlog: per-UID last login time, tty, and source host (mmap indexed by UID). faillog: per-UID failure count for lockout. tallylog: pam_tally2 data. All are binary — use last, lastb, lastlog, faillog commands to read.',
     perms:'-rw-rw-r--  root utmp  (664)',
     files:['wtmp','btmp','lastlog','faillog','tallylog'],
     tip:'<code>last -F</code> reads wtmp with full dates. <code>lastb</code> reads btmp (shows brute force). <code>last reboot</code> shows all reboots.'},

    {id:'log-mail',name:'mail.log',cat:'var',label:'mail.log',
     type:'mail server log',
     role:'Mail transfer agent (postfix/sendmail/exim) activity: received, sent, bounced, rejected messages.',
     desc:'mail.log: all mail events. mail.err: errors and rejections. mail.info: informational (connection events). mail.warn: warnings. Common entries: postfix/smtpd accepting/rejecting connections, postfix/smtp delivery attempts, postfix/local delivery, RBL (DNS blocklist) rejections, SPAM filter decisions, TLS handshake status. Rotated separately from syslog.',
     perms:'-rw-r--r--  root adm  (640)',
     files:['mail.log','mail.log.1','mail.err','mail.err.1','mail.info','mail.warn'],
